<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solosola Studio | Integrated Environment</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #1a1a1a; --panel-color: #252525; --text-color: #e0e0e0; 
            --accent-color: #00ccff; --border-color: #444; --warn-color: #ff4444; 
            --success-color: #00ff99;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Helvetica Neue', 'Noto Sans JP', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* --- LAYOUT --- */
        #sidebar { width: 280px; background: #111; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        #main-area { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
        #inspector { width: 320px; background: var(--panel-color); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; }
        
        /* --- COMMON UI --- */
        h1, h2, h3 { font-weight: 300; margin: 0; }
        .btn { border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; font-size: 0.8rem; }
        .btn:hover { opacity: 0.8; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-primary { background: var(--accent-color); color: #000; }
        .btn-danger { background: var(--warn-color); color: #fff; }
        .btn-icon { background: transparent; color: #888; font-size: 1rem; padding: 5px; }
        .btn-icon:hover { color: #fff; background: #333; }
        
        input[type="text"], select { background: #111; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 4px; }
        
        /* --- SIDEBAR --- */
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .project-status { font-size: 0.7rem; color: #666; margin-top: 5px; display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .status-dot.active { background: var(--success-color); box-shadow: 0 0 5px var(--success-color); }

        #set-list { flex: 1; overflow-y: auto; }
        .set-item { 
            padding: 12px 20px; border-bottom: 1px solid #222; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            border-left: 3px solid transparent; transition: background 0.2s;
        }
        .set-item:hover { background: #222; }
        .set-item.active { background: #2a2a2a; border-left-color: var(--accent-color); color: #fff; }
        .set-name { font-size: 0.9rem; pointer-events: none; }
        .set-id { font-size: 0.7rem; color: #666; pointer-events: none; }
        
        .sidebar-footer { padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; }

        /* --- MAIN AREA --- */
        #toolbar { 
            height: 60px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; background: #222;
        }
        #workspace { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }

        /* Generator Integration (Metadata) */
        #set-metadata { 
            width: 100%; max-width: 600px; background: #2a2a2a; padding: 20px; border-radius: 8px; margin-bottom: 20px; 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; border: 1px solid #333;
        }
        .meta-full { grid-column: span 2; }
        
        #bg-preview { 
            width: 100%; height: 100px; background: #000; margin-top: 5px; border-radius: 4px; border: 1px dashed #555;
            display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #666; cursor: pointer; background-size: cover; background-position: center;
        }
        #bg-preview:hover { border-color: var(--accent-color); color: var(--accent-color); }

        /* Grid */
        #grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 500px; height: 500px; }
        .pad-cell { 
            background: #333; border-radius: 4px; border: 1px solid #555; position: relative;
            cursor: pointer; transition: all 0.1s; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .pad-cell:hover { border-color: #888; }
        .pad-cell.selected { border-color: var(--accent-color); box-shadow: 0 0 10px rgba(0,204,255,0.2); background: #383838; }
        .pad-cell.playing { border-color: var(--success-color); background: #2a4035; }
        .pad-cell.has-file { background: #2a3540; }
        
        .pad-num { position: absolute; top: 5px; left: 8px; font-size: 0.7rem; opacity: 0.3; }
        .pad-label { font-size: 0.8rem; text-align: center; pointer-events: none; padding: 0 5px; word-break: break-all; }
        .pad-mode { position: absolute; bottom: 5px; right: 5px; font-size: 0.6rem; color: var(--accent-color); opacity: 0.8; }

        /* --- INSPECTOR --- */
        .inspector-header { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .inspector-content { padding: 20px; }
        .form-group { margin-bottom: 15px; }
        #drop-zone-audio {
            border: 2px dashed #555; padding: 20px; text-align: center; border-radius: 4px; cursor: pointer; color: #888; font-size: 0.8rem; transition: 0.2s;
        }
        #drop-zone-audio:hover { border-color: var(--accent-color); color: var(--accent-color); background: rgba(0,204,255,0.05); }

        /* --- MODAL (Cleanup) --- */
        #modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100;
            display: none; align-items: center; justify-content: center;
        }
        #modal-box { background: var(--panel-color); width: 500px; max-height: 80vh; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; }
        #cleanup-list { flex: 1; overflow-y: auto; margin: 15px 0; border: 1px solid #333; padding: 10px; }
        .cleanup-item { font-size: 0.8rem; padding: 5px; display: flex; justify-content: space-between; }
        .cleanup-item:hover { background: #333; }

    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1>SOLOSOLA STUDIO</h1>
            <div class="project-status">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">Project not loaded</span>
            </div>
            <button id="btn-load-project" class="btn btn-primary" style="width:100%; margin-top:10px;">📂 Open Project Folder</button>
        </div>
        
        <div style="padding:10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333;">
            <span style="font-size:0.8rem; color:#888;">SETS</span>
            <button class="btn-icon" title="New Set" onclick="createNewSet()">＋</button>
        </div>
        <div id="set-list">
            </div>

        <div class="sidebar-footer">
            <button class="btn btn-secondary" style="flex:1;" onclick="showCleanupModal()">🧹 Cleanup</button>
            <button id="btn-save-all" class="btn btn-primary" style="flex:2;" onclick="saveProjectData()" disabled>💾 SAVE ALL</button>
        </div>
    </div>

    <div id="main-area">
        <div id="toolbar">
            <h2 id="toolbar-title">No Set Selected</h2>
            <div>
                <button class="btn btn-danger" onclick="deleteCurrentSet()">Delete Set</button>
                <button class="btn btn-secondary" onclick="duplicateCurrentSet()">Duplicate</button>
            </div>
        </div>

        <div id="workspace">
            <div id="set-metadata" style="display:none;">
                <div class="meta-full">
                    <label>Set Name</label>
                    <input type="text" id="meta-name" oninput="updateMetadata('name', this.value)">
                </div>
                <div>
                    <label>Recorder</label>
                    <input type="text" id="meta-recorder" oninput="updateMetadata('recorder', this.value)">
                </div>
                <div>
                    <label>Category (Tag)</label>
                    <select id="meta-category" onchange="updateMetadata('category', this.value)">
                        </select>
                </div>
                <div class="meta-full">
                    <label>Background Image (Drop image here)</label>
                    <div id="bg-preview" title="Click or Drop Image">No Image</div>
                    <input type="file" id="bg-file-input" accept="image/*" style="display:none;">
                </div>
            </div>

            <div id="grid-container" style="display:none;">
                </div>
        </div>
    </div>

    <div id="inspector">
        <div class="inspector-header">
            <h2>PAD EDITOR</h2>
        </div>
        <div id="pad-editor-content" class="inspector-content" style="display:none;">
            <div class="form-group">
                <label>PAD ID</label>
                <input type="text" id="edit-id" readonly disabled>
            </div>
            
            <div class="form-group">
                <label>Audio File (Drop file to import)</label>
                <div id="drop-zone-audio">Drop Audio Here</div>
                <input type="text" id="edit-url" readonly style="font-size:0.7rem; color:#666; margin-top:5px; border:none; background:transparent;">
                <button class="btn btn-secondary" style="width:100%; margin-top:5px;" onclick="previewAudio()">▶️ Preview</button>
            </div>

            <div class="form-group">
                <label>Label</label>
                <input type="text" id="edit-label" oninput="updatePadData('label', this.value)">
            </div>

            <div class="form-group">
                <label>Mode</label>
                <select id="edit-mode" onchange="updatePadData('mode', this.value)">
                    <option value="gate">Gate (Hold)</option>
                    <option value="oneshot">OneShot</option>
                </select>
            </div>

            <div class="form-group">
                <label>Options</label>
                <div style="display:flex; flex-direction:column; gap:8px;">
                    <label><input type="checkbox" id="edit-loop" onchange="updatePadData('loop', this.checked)"> Loop Playback</label>
                    <label><input type="checkbox" id="edit-fadeIn" onchange="updatePadData('fadeIn', this.checked)"> Fade In (Anti-click)</label>
                    <label><input type="checkbox" id="edit-random" onchange="updatePadData('randomStart', this.checked)"> Random Start</label>
                </div>
            </div>
            
            <button class="btn btn-danger" style="width:100%; margin-top:20px;" onclick="clearPad()">Clear Pad</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-box">
            <h3>Unused Audio Files</h3>
            <p style="font-size:0.8rem; color:#888;">以下は data.json で使用されていないファイルです。</p>
            <div id="cleanup-list">Loading...</div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                <button class="btn btn-danger" onclick="executeCleanup()">Delete Selected</button>
            </div>
        </div>
    </div>

    <script>
        // --- GLOBAL STATE ---
        let dirHandle = null; // Root Directory Handle
        let projectData = null; // data.json content
        let currentSetKey = null;
        let currentPadId = null;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let currentSource = null;

        // --- 1. FILE SYSTEM ACCESS ---
        
        document.getElementById('btn-load-project').addEventListener('click', async () => {
            try {
                dirHandle = await window.showDirectoryPicker();
                await loadDataJson();
                updateUIState(true);
            } catch (err) {
                console.error(err);
                alert("フォルダの読み込みに失敗、またはキャンセルされました。");
            }
        });

        async function loadDataJson() {
            try {
                const fileHandle = await dirHandle.getFileHandle('data.json');
                const file = await fileHandle.getFile();
                const text = await file.text();
                projectData = JSON.parse(text);
                renderSetList();
                renderCategories();
            } catch (err) {
                alert("data.json が見つかりません。web-samplerのルートフォルダを選択してください。");
            }
        }

        async function saveProjectData() {
            if (!dirHandle || !projectData) return;
            try {
                const fileHandle = await dirHandle.getFileHandle('data.json', { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(JSON.stringify(projectData, null, 2));
                await writable.close();
                
                // Flash animation on save button
                const btn = document.getElementById('btn-save-all');
                const originalText = btn.innerText;
                btn.innerText = "✅ SAVED!";
                setTimeout(() => btn.innerText = originalText, 1000);
            } catch (err) {
                console.error(err);
                alert("保存に失敗しました。");
            }
        }

        // Helper: Save File to specific path
        async function saveFileToPath(folderPathArray, fileName, fileData) {
            let currentDir = dirHandle;
            // Recursively open/create folders
            for (const folder of folderPathArray) {
                currentDir = await currentDir.getDirectoryHandle(folder, { create: true });
            }
            const fileHandle = await currentDir.getFileHandle(fileName, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(fileData);
            await writable.close();
            return true;
        }

        // --- 2. LOGIC & DATA MANIPULATION ---

        function updateUIState(isLoaded) {
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            const saveBtn = document.getElementById('btn-save-all');
            
            if (isLoaded) {
                statusText.innerText = "Project Loaded: " + dirHandle.name;
                statusDot.classList.add('active');
                saveBtn.disabled = false;
            }
        }

        function createNewSet() {
            if (!projectData) return;
            const id = prompt("新しいセットIDを入力してください (例: soundscape-rain)", "new-set");
            if (!id || projectData.sets[id]) return alert("IDが無効か、既に存在します。");
            
            // Create dummy structure
            projectData.sets[id] = {
                name: "New Set",
                recorder: "Unknown",
                image: "",
                samples: Array(16).fill(null).map((_, i) => ({ id: i, url: "", label: "", mode: "gate", loop: false }))
            };
            
            // Add to 'TEST' category by default
            const testCat = projectData.categories.find(c => c.id === 'cat-test');
            if(testCat) testCat.sets.push(id);
            else projectData.categories[0].sets.push(id); // fallback

            renderSetList();
            selectSet(id);
        }

        function deleteCurrentSet() {
            if(!confirm(`セット "${currentSetKey}" を削除しますか？\n(音声ファイルは削除されません)`)) return;
            
            // Remove from categories
            projectData.categories.forEach(cat => {
                cat.sets = cat.sets.filter(s => s !== currentSetKey);
            });
            // Remove from sets
            delete projectData.sets[currentSetKey];
            
            currentSetKey = null;
            renderSetList();
            document.getElementById('set-metadata').style.display = 'none';
            document.getElementById('grid-container').style.display = 'none';
        }
        
        function duplicateCurrentSet() {
            const newId = prompt(`"${currentSetKey}" のコピーを作成します。新ID:`, currentSetKey + "-copy");
            if(!newId || projectData.sets[newId]) return;
            
            // Deep copy
            const copy = JSON.parse(JSON.stringify(projectData.sets[currentSetKey]));
            copy.name += " (Copy)";
            projectData.sets[newId] = copy;
            
            // Add to same category
            projectData.categories.forEach(cat => {
                if(cat.sets.includes(currentSetKey)) cat.sets.push(newId);
            });
            
            renderSetList();
            selectSet(newId);
        }

        // --- 3. UI RENDERING ---

        function renderSetList() {
            const list = document.getElementById('set-list');
            list.innerHTML = '';
            
            Object.keys(projectData.sets).forEach(key => {
                const set = projectData.sets[key];
                const el = document.createElement('div');
                el.className = `set-item ${key === currentSetKey ? 'active' : ''}`;
                el.innerHTML = `<span class="set-name">${set.name}</span><span class="set-id">${key}</span>`;
                el.onclick = () => selectSet(key);
                list.appendChild(el);
            });
        }

        function renderCategories() {
            const sel = document.getElementById('meta-category');
            sel.innerHTML = '';
            projectData.categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.innerText = cat.label;
                sel.appendChild(opt);
            });
        }

        function selectSet(key) {
            currentSetKey = key;
            const setData = projectData.sets[key];
            
            renderSetList(); // Update active class
            
            document.getElementById('toolbar-title').innerText = setData.name;
            document.getElementById('set-metadata').style.display = 'grid';
            document.getElementById('grid-container').style.display = 'grid';
            
            // Populate Metadata Form
            document.getElementById('meta-name').value = setData.name;
            document.getElementById('meta-recorder').value = setData.recorder;
            
            // Find current category
            const cat = projectData.categories.find(c => c.sets.includes(key));
            if(cat) document.getElementById('meta-category').value = cat.id;

            // Background Image
            updateBgPreview(setData.image);

            renderGrid();
        }

        function updateBgPreview(path) {
            const prev = document.getElementById('bg-preview');
            if(path) {
                // Since we can't easily resolve relative path in File System Access API without a server in middle,
                // we assume local dev server structure for preview:
                // If running on VS Code Live Server, relative paths work.
                prev.innerText = "";
                prev.style.backgroundImage = `url('${path}')`;
            } else {
                prev.style.backgroundImage = 'none';
                prev.innerText = "No Image (Drop Here)";
            }
        }

        // --- 4. PAD & AUDIO LOGIC ---

        function renderGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            const samples = projectData.sets[currentSetKey].samples;
            
            for(let i=0; i<16; i++) {
                const sample = samples.find(s => s.id === i) || {id:i};
                const el = document.createElement('div');
                el.className = `pad-cell ${sample.url ? 'has-file' : ''}`;
                el.id = `pad-${i}`;
                el.onclick = () => selectPad(i);
                
                el.innerHTML = `
                    <span class="pad-num">${i}</span>
                    <span class="pad-label">${sample.label || ''}</span>
                    <span class="pad-mode">${sample.mode === 'gate' ? 'GATE' : 'ONE'}</span>
                `;
                container.appendChild(el);
            }
            // Clear inspector if pad not selected
            document.getElementById('pad-editor-content').style.display = 'none';
        }

        function selectPad(id) {
            currentPadId = id;
            document.querySelectorAll('.pad-cell').forEach(el => el.classList.remove('selected'));
            document.getElementById(`pad-${id}`).classList.add('selected');
            
            const sample = projectData.sets[currentSetKey].samples.find(s => s.id === id) || {id:id, mode:'gate', loop:false};
            
            // Fill Inspector
            document.getElementById('pad-editor-content').style.display = 'block';
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-url').value = sample.url || '';
            document.getElementById('edit-label').value = sample.label || '';
            document.getElementById('edit-mode').value = sample.mode || 'gate';
            document.getElementById('edit-loop').checked = !!sample.loop;
            document.getElementById('edit-fadeIn').checked = !!sample.fadeIn;
            document.getElementById('edit-random').checked = !!sample.randomStart;
        }

        function updateMetadata(field, value) {
            if(!currentSetKey) return;
            const set = projectData.sets[currentSetKey];
            
            if (field === 'category') {
                // Move set between categories
                projectData.categories.forEach(cat => {
                    cat.sets = cat.sets.filter(s => s !== currentSetKey);
                });
                const newCat = projectData.categories.find(c => c.id === value);
                if(newCat) newCat.sets.push(currentSetKey);
            } else {
                set[field] = value;
                if (field === 'name') document.getElementById('toolbar-title').innerText = value;
            }
        }

        function updatePadData(field, value) {
            if(!currentSetKey || currentPadId === null) return;
            const samples = projectData.sets[currentSetKey].samples;
            let sample = samples.find(s => s.id === currentPadId);
            if(!sample) {
                sample = { id: currentPadId };
                samples.push(sample);
                samples.sort((a,b)=>a.id-b.id);
            }
            sample[field] = value;
            renderGrid();
            document.getElementById(`pad-${currentPadId}`).classList.add('selected'); // Re-select
        }

        async function previewAudio() {
            if(!currentSetKey || currentPadId === null) return;
            const sample = projectData.sets[currentSetKey].samples.find(s => s.id === currentPadId);
            if(!sample || !sample.url) return;

            if(currentSource) { currentSource.stop(); currentSource = null; }

            try {
                // For preview, we try to fetch relative to current location
                // This assumes editor.html is in root
                const res = await fetch(sample.url);
                const buf = await res.arrayBuffer();
                const audioBuf = await audioCtx.decodeAudioData(buf);
                
                const src = audioCtx.createBufferSource();
                src.buffer = audioBuf;
                src.connect(audioCtx.destination);
                src.start(0);
                currentSource = src;
                
                // Visual feedback
                const pad = document.getElementById(`pad-${currentPadId}`);
                pad.classList.add('playing');
                setTimeout(() => pad.classList.remove('playing'), Math.min(audioBuf.duration * 1000, 500));
            } catch(e) {
                console.error(e);
                alert("再生できませんでした。パスが正しいか、サーバ上で実行しているか確認してください。");
            }
        }

        // --- DRAG & DROP LOGIC (AUTO-IMPORT) ---

        // Audio Drop
        const dropAudio = document.getElementById('drop-zone-audio');
        dropAudio.addEventListener('dragover', e => { e.preventDefault(); dropAudio.style.borderColor = '#00ccff'; });
        dropAudio.addEventListener('dragleave', e => { e.preventDefault(); dropAudio.style.borderColor = '#555'; });
        dropAudio.addEventListener('drop', async e => {
            e.preventDefault(); dropAudio.style.borderColor = '#555';
            if(e.dataTransfer.files[0]) {
                await importAudioFile(e.dataTransfer.files[0]);
            }
        });

        async function importAudioFile(file) {
            if(!currentSetKey || currentPadId === null) return;
            
            // 1. Determine Path: assets/audio/[setID]/[filename]
            const fileName = file.name;
            const targetPath = ['assets', 'audio', currentSetKey];
            const fullPathStr = `assets/audio/${currentSetKey}/${fileName}`;

            // 2. Save File using File System API
            const saved = await saveFileToPath(targetPath, fileName, file);
            
            if(saved) {
                // 3. Update Data
                updatePadData('url', fullPathStr);
                if(!document.getElementById('edit-label').value) {
                    updatePadData('label', fileName.replace(/\.[^/.]+$/, ""));
                    document.getElementById('edit-label').value = fileName.replace(/\.[^/.]+$/, "");
                }
                document.getElementById('edit-url').value = fullPathStr;
            }
        }
        
        // Background Image Drop
        const dropBg = document.getElementById('bg-preview');
        dropBg.addEventListener('dragover', e => { e.preventDefault(); dropBg.style.borderColor = '#00ccff'; });
        dropBg.addEventListener('dragleave', e => { e.preventDefault(); dropBg.style.borderColor = '#555'; });
        dropBg.addEventListener('drop', async e => {
            e.preventDefault(); dropBg.style.borderColor = '#555';
            if(e.dataTransfer.files[0] && e.dataTransfer.files[0].type.startsWith('image/')) {
                await importBgFile(e.dataTransfer.files[0]);
            }
        });
        // Click to browse (using hidden input)
        dropBg.addEventListener('click', () => document.getElementById('bg-file-input').click());
        document.getElementById('bg-file-input').addEventListener('change', async e => {
            if(e.target.files[0]) await importBgFile(e.target.files[0]);
        });

        async function importBgFile(file) {
            if(!currentSetKey) return;
            const fileName = file.name;
            const targetPath = ['assets', 'images'];
            const fullPathStr = `assets/images/${fileName}`;
            
            await saveFileToPath(targetPath, fileName, file);
            updateMetadata('image', fullPathStr);
            updateBgPreview(fullPathStr);
        }

        // --- CLEANUP FEATURE ---
        
        async function showCleanupModal() {
            if(!projectData) return;
            const modal = document.getElementById('modal-overlay');
            const list = document.getElementById('cleanup-list');
            modal.style.display = 'flex';
            list.innerHTML = 'Scanning files...';

            // Collect used files
            const usedFiles = new Set();
            Object.values(projectData.sets).forEach(set => {
                set.samples.forEach(s => { if(s.url) usedFiles.add(s.url); });
            });

            // Scan directory
            // This is complex recursive scan. For MVP, we scan assets/audio/*/*
            const unused = [];
            
            try {
                const assets = await dirHandle.getDirectoryHandle('assets');
                const audio = await assets.getDirectoryHandle('audio');
                
                // Iterate Set Folders
                for await (const [setName, setDir] of audio.entries()) {
                    if (setDir.kind === 'directory') {
                        for await (const [fileName, fileHandle] of setDir.entries()) {
                            if (fileHandle.kind === 'file') {
                                const fullPath = `assets/audio/${setName}/${fileName}`;
                                if (!usedFiles.has(fullPath)) {
                                    unused.push({ name: fileName, path: fullPath, handle: fileHandle });
                                }
                            }
                        }
                    }
                }
            } catch(e) { console.error(e); }

            list.innerHTML = '';
            if(unused.length === 0) {
                list.innerHTML = '<div style="padding:10px;">未使用ファイルはありません。</div>';
            } else {
                unused.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'cleanup-item';
                    el.innerHTML = `<span>${item.path}</span>`;
                    // Note: We don't implement checkbox selection for MVP, just list. 
                    // To implement delete, we need to pass handles.
                    el.dataset.path = item.path;
                    list.appendChild(el);
                });
            }
            window.unusedFilesCache = unused;
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        async function executeCleanup() {
            if(!window.unusedFilesCache || window.unusedFilesCache.length === 0) return;
            if(!confirm(`${window.unusedFilesCache.length} 個のファイルを削除しますか？\nこの操作は取り消せません。`)) return;

            for(const item of window.unusedFilesCache) {
                try {
                    await item.handle.remove();
                } catch(e) { console.error("Failed to remove", item.path); }
            }
            alert("削除完了しました。");
            closeModal();
        }

        function clearPad() {
            if(!confirm("パッド情報をクリアしますか？")) return;
            updatePadData('url', '');
            updatePadData('label', '');
            updatePadData('mode', 'gate');
            updatePadData('loop', false);
            updatePadData('fadeIn', false);
            updatePadData('randomStart', false);
            document.getElementById('edit-url').value = "";
            document.getElementById('edit-label').value = "";
        }

    </script>
</body>
</html>
