<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solosola Data Editor V3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #1a1a1a; --panel-color: #2a2a2a; --text-color: #e0e0e0; --accent-color: #00ccff; --warn-color: #ff4444; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Helvetica Neue', 'Noto Sans JP', sans-serif; margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        h1 { font-weight: 100; letter-spacing: 0.2em; margin-bottom: 30px; }
        .container { width: 100%; max-width: 1100px; display: grid; gap: 20px; }
        .section { background-color: var(--panel-color); padding: 20px; border-radius: 8px; }
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 10px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        
        #drop-zone { border: 2px dashed #555; padding: 30px; text-align: center; color: #888; border-radius: 8px; transition: all 0.3s; cursor: pointer; }
        #drop-zone.hover { border-color: var(--accent-color); background-color: rgba(0, 204, 255, 0.1); color: var(--accent-color); }
        
        #sample-list { display: grid; grid-template-columns: 1fr; gap: 8px; }
        
        /* Grid Layout for Sample Row: Improved for more controls */
        .sample-row { 
            background: #222; padding: 10px; border-radius: 4px; 
            display: grid; 
            grid-template-columns: 40px 150px 1fr 90px 60px 60px 60px 30px; 
            gap: 10px; align-items: center; border-left: 3px solid #444; 
        }
        .sample-row.filled { border-left-color: var(--accent-color); background: #282828; }
        
        .id-cell { color: #888; font-size: 0.8rem; font-weight: bold; }
        .filename-cell { font-size: 0.7rem; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        select, .file-input-btn { background: #111; color: #fff; border: 1px solid #444; padding: 5px; font-size: 0.8rem; }
        
        /* Checkbox styling */
        .chk-label { font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        
        textarea { width: 100%; height: 150px; background: #111; color: #0f0; font-family: monospace; border: 1px solid #444; padding: 15px; box-sizing: border-box; border-radius: 8px; margin-top: 10px; white-space: pre; overflow-x: auto; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { border: none; padding: 15px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button.primary { flex: 2; background-color: var(--accent-color); color: #000; }
        button.secondary { flex: 1; background-color: #444; color: #fff; }
        button.load { background-color: #e0e0e0; color: #000; width: 100%; margin-top: 10px; }
        
        .clear-btn { color: var(--warn-color); cursor: pointer; font-size: 1.2rem; line-height: 1; text-align: center; }
        .note { font-size: 0.7rem; color: #666; margin-top: 5px; }
        
        h2 { font-size: 1rem; color: #888; margin-top: 30px; border-bottom: 1px solid #444; padding-bottom: 5px; }
    </style>
</head>
<body>

    <h1>SOLOSOLA DATA EDITOR <span style="font-size:0.5em; opacity:0.5;">v3.0</span></h1>

    <div class="container">
        <div class="section">
            <div class="input-group">
                <div><label>セットID (JSON Key)</label><input type="text" id="set-id" placeholder="shibuya-night"></div>
                <div><label>セット名 (表示用)</label><input type="text" id="set-name" placeholder="東京・渋谷"></div>
            </div>
            <div class="input-group">
                <div><label>制作者名</label><input type="text" id="recorder" placeholder="Recorded by Solosola"></div>
                <div><label>背景画像URL</label><input type="text" id="image-url" placeholder="assets/images/bg.jpg"></div>
            </div>
            <div>
                <label>オーディオ格納パス (末尾 / 必須)</label>
                <input type="text" id="base-path" value="assets/audio/" placeholder="assets/audio/">
            </div>
        </div>

        <div id="drop-zone">
            音声ファイルをドロップ (自動割り当て)
        </div>

        <div id="sample-list"></div>

        <div class="btn-group">
            <button class="primary" onclick="generateJson()">GENERATE JSON</button>
            <button class="secondary" onclick="copyToClipboard()">COPY</button>
        </div>
        <textarea id="output-area" readonly placeholder="生成されたJSONがここに表示されます"></textarea>

        <h2>EXISTING DATA IMPORT</h2>
        <div class="section">
            <label>編集したいJSONデータ（1セット分、またはSet部分のみ）をここに貼り付けてください</label>
            <textarea id="import-area" style="color: #ccc; height: 100px;" placeholder='例: "shibuya": { "name": "...", "samples": [...] },'></textarea>
            <button class="load" onclick="importJson()">LOAD JSON</button>
        </div>
    </div>

    <script>
        // データ構造の初期化（V3仕様：randomStart, fadeInを追加）
        let samplesData = Array(16).fill(null).map((_, i) => ({
            id: i, filename: '', label: '', mode: 'gate', loop: false, 
            randomStart: false, fadeIn: false
        }));

        function renderList() {
            const listEl = document.getElementById('sample-list');
            listEl.innerHTML = '';
            samplesData.forEach((s, i) => {
                const row = document.createElement('div');
                row.className = `sample-row ${s.filename ? 'filled' : ''}`;
                row.innerHTML = `
                    <div class="id-cell">${i+1}</div>
                    <div>
                        <input type="file" id="file-${i}" style="display:none" accept="audio/*" onchange="handleFileSelect(${i}, this)">
                        <button class="file-input-btn" onclick="document.getElementById('file-${i}').click()">FILE</button>
                        <div class="filename-cell" title="${s.filename}">${s.filename || '---'}</div>
                    </div>
                    <input type="text" placeholder="Label" value="${s.label}" oninput="updateData(${i}, 'label', this.value)">
                    <select onchange="updateData(${i}, 'mode', this.value)">
                        <option value="gate" ${s.mode === 'gate' ? 'selected' : ''}>Gate</option>
                        <option value="oneshot" ${s.mode === 'oneshot' ? 'selected' : ''}>OneShot</option>
                    </select>
                    
                    <label class="chk-label"><input type="checkbox" ${s.loop ? 'checked' : ''} onchange="updateData(${i}, 'loop', this.checked)"> Loop</label>
                    <label class="chk-label" title="開始位置をランダムにずらす"><input type="checkbox" ${s.randomStart ? 'checked' : ''} onchange="updateData(${i}, 'randomStart', this.checked)"> Rnd</label>
                    <label class="chk-label" title="冒頭のプチノイズ防止"><input type="checkbox" ${s.fadeIn ? 'checked' : ''} onchange="updateData(${i}, 'fadeIn', this.checked)"> Fade</label>
                    
                    <div class="clear-btn" onclick="clearSlot(${i})">×</div>
                `;
                listEl.appendChild(row);
            });
        }

        function updateData(i, key, val) { samplesData[i][key] = val; }

        function clearSlot(i) {
            samplesData[i] = { id: i, filename: '', label: '', mode: 'gate', loop: false, randomStart: false, fadeIn: false };
            renderList();
        }

        function handleFileSelect(i, input) {
            if (input.files && input.files[0]) assignFile(i, input.files[0]);
        }

        function assignFile(i, file) {
            samplesData[i].filename = file.name;
            if(!samplesData[i].label) samplesData[i].label = file.name.replace(/\.[^/.]+$/, "");
            renderList();
        }

        const dropZone = document.getElementById('drop-zone');
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('hover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('hover');
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/'));
            let fileIdx = 0;
            for (let i = 0; i < 16 && fileIdx < files.length; i++) {
                if (!samplesData[i].filename) { assignFile(i, files[fileIdx]); fileIdx++; }
            }
        });

        function generateJson() {
            const setId = document.getElementById('set-id').value || 'new-set';
            let basePath = document.getElementById('base-path').value || 'assets/audio/';
            if (!basePath.endsWith('/')) basePath += '/';

            const setObj = {
                name: document.getElementById('set-name').value || 'New Set',
                recorder: document.getElementById('recorder').value || 'Unknown',
                image: document.getElementById('image-url').value || '',
                samples: samplesData.map(s => ({
                    id: s.id,
                    url: s.filename ? (basePath + s.filename) : "",
                    label: s.label || `Sound ${s.id + 1}`,
                    mode: s.mode,
                    loop: s.loop,
                    // V3 追加プロパティ（trueの時だけ書き出すことでJSONを軽くする）
                    ...(s.randomStart && { randomStart: true }),
                    ...(s.fadeIn && { fadeIn: true })
                }))
            };

            const jsonBody = JSON.stringify(setObj, null, 4);
            // キー部分も含めて出力
            document.getElementById('output-area').value = `"${setId}": ${jsonBody},`;
        }

        function importJson() {
            const rawInput = document.getElementById('import-area').value.trim();
            if (!rawInput) return alert("JSONデータを貼り付けてください");

            try {
                // キー（"shibuya":）が含まれている場合に対応するため、全体を{}で囲んでパースを試みる
                let jsonStr = rawInput;
                // 末尾のカンマを除去
                if (jsonStr.endsWith(',')) jsonStr = jsonStr.slice(0, -1);
                
                let parsed;
                // 形式が "key": { ... } か { ... } かを判定
                if (jsonStr.startsWith('"') || jsonStr.trim().startsWith("'")) {
                    parsed = JSON.parse(`{${jsonStr}}`);
                    const keys = Object.keys(parsed);
                    if (keys.length > 0) {
                        document.getElementById('set-id').value = keys[0]; // キーをID入力欄へ
                        parsed = parsed[keys[0]]; // 中身を取り出す
                    }
                } else {
                    parsed = JSON.parse(jsonStr);
                }

                // 各フィールドへの反映
                if(parsed.name) document.getElementById('set-name').value = parsed.name;
                if(parsed.recorder) document.getElementById('recorder').value = parsed.recorder;
                if(parsed.image) document.getElementById('image-url').value = parsed.image;

                // サンプルデータの復元
                if (parsed.samples && Array.isArray(parsed.samples)) {
                    // パス設定の推定（最初のファイルのパスからディレクトリを抽出）
                    const firstSample = parsed.samples.find(s => s.url);
                    if (firstSample) {
                        const pathMatch = firstSample.url.match(/^(.*\/)/);
                        if (pathMatch) document.getElementById('base-path').value = pathMatch[1];
                    }

                    // データの流し込み
                    samplesData.forEach(d => {
                        // 初期化
                        d.filename = ''; d.label = ''; d.mode = 'gate'; d.loop = false; d.randomStart = false; d.fadeIn = false;
                    });

                    parsed.samples.forEach(s => {
                        const idx = s.id;
                        if (idx >= 0 && idx < 16) {
                            // URLからファイル名だけ抽出
                            const fileName = s.url ? s.url.split('/').pop() : '';
                            
                            samplesData[idx] = {
                                id: idx,
                                filename: fileName,
                                label: s.label || '',
                                mode: s.mode || 'gate',
                                loop: !!s.loop,
                                randomStart: !!s.randomStart,
                                fadeIn: !!s.fadeIn
                            };
                        }
                    });
                }
                renderList();
                alert("データを読み込みました！");
            } catch (e) {
                console.error(e);
                alert("JSONの読み込みに失敗しました。\n形式を確認してください。\n例: \"key\": { ... } または { ... }");
            }
        }

        function copyToClipboard() {
            const copyText = document.getElementById("output-area");
            copyText.select(); navigator.clipboard.writeText(copyText.value);
            alert("Copied!");
        }

        renderList();
    </script>
</body>
</html>
