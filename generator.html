<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solosola Set Generator V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2a2a2a;
            --text-color: #e0e0e0;
            --accent-color: #00ccff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', 'Noto Sans JP', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex; flex-direction: column; align-items: center;
        }

        h1 { font-weight: 100; letter-spacing: 0.2em; margin-bottom: 30px; }

        .container { width: 100%; max-width: 1000px; display: grid; gap: 20px; }

        .section { background-color: var(--panel-color); padding: 20px; border-radius: 8px; }

        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }

        label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; }

        input[type="text"] {
            width: 100%; padding: 10px; background: #111; border: 1px solid #444;
            color: #fff; border-radius: 4px; box-sizing: border-box;
        }

        #drop-zone {
            border: 2px dashed #555; padding: 30px; text-align: center;
            color: #888; border-radius: 8px; transition: all 0.3s; cursor: pointer;
        }
        #drop-zone.hover { border-color: var(--accent-color); background-color: rgba(0, 204, 255, 0.1); color: var(--accent-color); }

        #sample-list { display: grid; grid-template-columns: 1fr; gap: 8px; }

        .sample-row {
            background: #222; padding: 10px; border-radius: 4px;
            display: grid; grid-template-columns: 40px 180px 1fr 100px 80px 40px;
            gap: 10px; align-items: center; border-left: 3px solid #444;
        }
        .sample-row.filled { border-left-color: var(--accent-color); background: #282828; }

        .id-cell { color: #888; font-size: 0.8rem; font-weight: bold; }
        .filename-cell { font-size: 0.7rem; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        select, .file-input-btn {
            background: #111; color: #fff; border: 1px solid #444; padding: 5px; font-size: 0.8rem;
        }

        textarea {
            width: 100%; height: 200px; background: #111; color: #0f0;
            font-family: monospace; border: 1px solid #444; padding: 15px;
            box-sizing: border-box; border-radius: 8px; margin-top: 10px;
        }

        button.primary {
            background-color: var(--accent-color); color: #000; border: none;
            padding: 15px; font-size: 1rem; font-weight: bold; border-radius: 4px;
            cursor: pointer; width: 100%;
        }

        .clear-btn { color: #866; cursor: pointer; font-size: 0.7rem; text-align: center; }
    </style>
</head>
<body>

    <h1>SOLOSOLA SET GENERATOR</h1>

    <div class="container">
        <div class="section">
            <div class="input-group">
                <div><label>セットID</label><input type="text" id="set-id" placeholder="shibuya-night"></div>
                <div><label>セット名</label><input type="text" id="set-name" placeholder="東京・渋谷"></div>
            </div>
            <div class="input-group">
                <div><label>制作者名</label><input type="text" id="recorder" placeholder="Recorded by Solosola"></div>
                <div><label>背景画像URL (ファイル名だけでも可)</label><input type="text" id="image-url" placeholder="bg.jpg"></div>
            </div>
        </div>

        <div id="drop-zone">
            ここに音声ファイルをまとめてドロップ（空いている枠に順次追加されます）
        </div>

        <div id="sample-list"></div>

        <button class="primary" onclick="generateJson()">GENERATE JSON</button>
        <textarea id="output-area" readonly placeholder="生成されたJSONがここに表示されます"></textarea>
    </div>

    <script>
        let samplesData = Array(16).fill(null).map((_, i) => ({
            id: i, filename: '', label: '', mode: 'gate', loop: false
        }));

        function renderList() {
            const listEl = document.getElementById('sample-list');
            listEl.innerHTML = '';
            samplesData.forEach((s, i) => {
                const row = document.createElement('div');
                row.className = `sample-row ${s.filename ? 'filled' : ''}`;
                row.innerHTML = `
                    <div class="id-cell">PAD${i+1}</div>
                    <div>
                        <input type="file" id="file-${i}" style="display:none" accept="audio/*" onchange="handleFileSelect(${i}, this)">
                        <button class="file-input-btn" onclick="document.getElementById('file-${i}').click()">ファイル選択</button>
                        <div class="filename-cell" title="${s.filename}">${s.filename || 'no file'}</div>
                    </div>
                    <input type="text" placeholder="表示名" value="${s.label}" oninput="updateData(${i}, 'label', this.value)">
                    <select onchange="updateData(${i}, 'mode', this.value)">
                        <option value="gate" ${s.mode === 'gate' ? 'selected' : ''}>Gate(長押)</option>
                        <option value="oneshot" ${s.mode === 'oneshot' ? 'selected' : ''}>One(1回)</option>
                    </select>
                    <label style="font-size:0.7rem;"><input type="checkbox" ${s.loop ? 'checked' : ''} onchange="updateData(${i}, 'loop', this.checked)"> Loop</label>
                    <div class="clear-btn" onclick="clearSlot(${i})">×消去</div>
                `;
                listEl.appendChild(row);
            });
        }

        function updateData(i, key, val) { samplesData[i][key] = val; }

        function clearSlot(i) {
            samplesData[i] = { id: i, filename: '', label: '', mode: 'gate', loop: false };
            renderList();
        }

        function handleFileSelect(i, input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                samplesData[i].filename = file.name;
                if(!samplesData[i].label) samplesData[i].label = file.name.replace(/\.[^/.]+$/, "");
                renderList();
            }
        }

        const dropZone = document.getElementById('drop-zone');
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('hover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/'));
            
            // 空いているスロットを探して順次入れる
            let fileIdx = 0;
            for (let i = 0; i < 16 && fileIdx < files.length; i++) {
                if (!samplesData[i].filename) {
                    samplesData[i].filename = files[fileIdx].name;
                    samplesData[i].label = files[fileIdx].name.replace(/\.[^/.]+$/, "");
                    fileIdx++;
                }
            }
            renderList();
        });

        function generateJson() {
            const setId = document.getElementById('set-id').value || 'new-set';
            const res = {
                [setId]: {
                    name: document.getElementById('set-name').value || 'New Set',
                    recorder: document.getElementById('recorder').value || 'Unknown',
                    image: document.getElementById('image-url').value || '',
                    samples: samplesData.map(s => ({
                        id: s.id, url: "assets/audio/" + s.filename, // フォルダパスを自動付与
                        label: s.label || "Sound " + s.id,
                        mode: s.mode, loop: s.loop
                    }))
                }
            };
            document.getElementById('output-area').value = JSON.stringify(res, null, 2) + ",";
        }

        renderList();
    </script>
</body>
</html>
