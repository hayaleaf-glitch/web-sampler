<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solosola Set Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2a2a2a;
            --text-color: #e0e0e0;
            --accent-color: #00ccff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', 'Noto Sans JP', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { font-weight: 100; letter-spacing: 0.2em; margin-bottom: 30px; }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            gap: 20px;
        }

        /* 基本設定エリア */
        .section {
            background-color: var(--panel-color);
            padding: 20px;
            border-radius: 8px;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* ドロップゾーン */
        #drop-zone {
            border: 2px dashed #555;
            padding: 40px;
            text-align: center;
            color: #888;
            border-radius: 8px;
            transition: all 0.3s;
            cursor: pointer;
        }
        #drop-zone.hover {
            border-color: var(--accent-color);
            background-color: rgba(0, 204, 255, 0.1);
            color: var(--accent-color);
        }

        /* サンプルリスト */
        #sample-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 10px;
        }

        .sample-row {
            background: #222;
            padding: 10px;
            border-radius: 4px;
            display: grid;
            grid-template-columns: 30px 1fr 1fr 80px 60px;
            gap: 10px;
            align-items: center;
            border-left: 3px solid #555;
        }

        .id-cell { color: #555; font-size: 0.8rem; }
        .filename-cell { font-size: 0.8rem; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
        
        select {
            background: #111;
            color: #fff;
            border: 1px solid #444;
            padding: 5px;
        }

        /* JSON出力エリア */
        textarea {
            width: 100%;
            height: 300px;
            background: #111;
            color: #0f0;
            font-family: monospace;
            border: 1px solid #444;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 8px;
        }

        button.primary {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button.primary:hover { opacity: 0.9; }

    </style>
</head>
<body>

    <h1>SOLOSOLA SET GENERATOR</h1>

    <div class="container">
        <div class="section">
            <div class="input-group">
                <div>
                    <label>セットID (例: soundscape-tokyo)</label>
                    <input type="text" id="set-id" placeholder="英数字のみ">
                </div>
                <div>
                    <label>セット名 (表示用)</label>
                    <input type="text" id="set-name" placeholder="例: 東京・渋谷">
                </div>
            </div>
            <div class="input-group">
                <div>
                    <label>制作者名</label>
                    <input type="text" id="recorder" placeholder="例: Recorded by Solosola">
                </div>
                <div>
                    <label>背景画像URL</label>
                    <input type="text" id="image-url" placeholder="https://...">
                </div>
            </div>
        </div>

        <div id="drop-zone">
            ここに音声ファイル(mp3)を16個までドラッグ＆ドロップしてください
        </div>

        <div id="sample-list">
            </div>

        <button class="primary" onclick="generateJson()">GENERATE JSON</button>

        <textarea id="output-area" placeholder="ここにJSONが生成されます"></textarea>
    </div>

    <script>
        // 初期化：16個の空スロットを作る
        const sampleList = document.getElementById('sample-list');
        let samplesData = Array(16).fill(null).map((_, i) => ({
            id: i,
            filename: '',
            label: 'No Sound',
            mode: 'gate',
            loop: false
        }));

        function renderList() {
            sampleList.innerHTML = '';
            samplesData.forEach((sample, i) => {
                const div = document.createElement('div');
                div.className = 'sample-row';
                div.innerHTML = `
                    <div class="id-cell">#${i}</div>
                    <div class="filename-cell">${sample.filename || '(空)'}</div>
                    <input type="text" placeholder="ラベル (例: 足音)" value="${sample.label}" oninput="updateData(${i}, 'label', this.value)">
                    <select onchange="updateData(${i}, 'mode', this.value)">
                        <option value="gate" ${sample.mode === 'gate' ? 'selected' : ''}>Gate</option>
                        <option value="oneshot" ${sample.mode === 'oneshot' ? 'selected' : ''}>One</option>
                    </select>
                    <label style="margin:0; font-size:0.7rem; display:flex; align-items:center;">
                        <input type="checkbox" ${sample.loop ? 'checked' : ''} onchange="updateData(${i}, 'loop', this.checked)"> Loop
                    </label>
                `;
                sampleList.appendChild(div);
            });
        }

        function updateData(index, key, value) {
            samplesData[index][key] = value;
        }

        // ドラッグ＆ドロップ処理
        const dropZone = document.getElementById('drop-zone');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('hover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('hover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');

            const files = Array.from(e.dataTransfer.files)
                .filter(f => f.type.startsWith('audio/'))
                .sort((a, b) => a.name.localeCompare(b.name)); // 名前順にソート

            // ファイルをスロットに割り当て
            files.slice(0, 16).forEach((file, i) => {
                samplesData[i].filename = file.name;
                // ファイル名から拡張子を除いたものを初期ラベルにする
                samplesData[i].label = file.name.replace(/\.[^/.]+$/, "");
            });

            renderList();
        });

        // JSON生成処理
        function generateJson() {
            const setId = document.getElementById('set-id').value || 'new-set';
            const setName = document.getElementById('set-name').value || 'New Set';
            const recorder = document.getElementById('recorder').value || 'Unknown';
            const imageUrl = document.getElementById('image-url').value || '';

            const setObj = {
                [setId]: {
                    name: setName,
                    recorder: recorder,
                    image: imageUrl,
                    samples: samplesData.map(s => ({
                        id: s.id,
                        url: s.filename, // ※注意: 実際のアップロードパスに合わせて調整が必要
                        label: s.label,
                        mode: s.mode,
                        loop: s.loop
                    }))
                }
            };

            // フォーマットして表示
            const jsonString = JSON.stringify(setObj, null, 2);
            // オブジェクトのキー部分の括弧を外して、コピペしやすくする（手動マージ用）
            // そのままでも使えるが、data.jsonの "sets": { ... } の中身として貼り付ける想定
            
            const output = `"sets":の波括弧の中に以下を貼り付けてください（カンマに注意）：\n\n${jsonString.slice(2, -2)}`;
            
            document.getElementById('output-area').value = jsonString.slice(2, -2) + ","; 
        }

        // 初回描画
        renderList();
    </script>
</body>
</html>
