<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solosola | Soundscape Media</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           Global Design: The Canvas of Silence
           ========================================= */
        :root {
            --bg-color: #111111; /* マットなダークグレー */
            --text-color: #ffffff;
            --accent-overlay: rgba(255, 255, 255, 0.4); /* 打鍵時の光 */
            --transition-speed: 0.6s;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', 'Noto Sans JP', sans-serif;
            font-weight: 100; /* UltraLight / Thin */
            overflow: hidden; /* 世界の端（スクロールバー）を隠す */
            -webkit-font-smoothing: antialiased;
        }

        /* =========================================
           Meta Info: The Coordinates of Memory
           ========================================= */
        #meta-display {
            position: absolute;
            top: 6vmin;
            left: 6vmin;
            z-index: 10;
            pointer-events: none; /* 演奏を邪魔しない */
            opacity: 0;
            animation: fadeIn 2s ease-out forwards 0.5s;
        }

        #place-name {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 0.15em;
            font-weight: 300;
            text-transform: uppercase;
        }

        #recorder-name {
            margin: 5px 0 0 0;
            font-size: 0.75rem;
            opacity: 0.6;
            letter-spacing: 0.05em;
            font-weight: 100;
        }

        /* =========================================
           The Instrument: Fragmented Landscape
           ========================================= */
        #sampler-wrapper {
            /* 常に正方形を維持し、画面に収まる最大のサイズを計算 */
            width: 85vmin;
            height: 85vmin;
            max-width: 600px;
            max-height: 600px;
            position: relative;
        }

        #sampler-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0px; /* 隙間なく配置し、一枚の絵として統合する */
            width: 100%;
            height: 100%;
            transition: opacity var(--transition-speed) ease;
        }

        .pad {
            position: relative;
            background-color: #222; /* 画像ロード前の下地 */
            background-size: 400% 400%; /* 画像を4倍に拡大し、その一部を表示する */
            background-repeat: no-repeat;
            cursor: pointer;
            user-select: none;
            
            /* 視覚的なフィードバックの準備 */
            filter: brightness(1.0) grayscale(0.2); 
            transition: filter 0.05s ease-out;
        }

        /* 打鍵時のエフェクト: 
           風景のその一点だけに光が差し込むような表現
        */
        .pad::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--text-color);
            opacity: 0;
            transition: opacity 0.05s ease-out;
            pointer-events: none;
        }

        .pad.active {
            filter: brightness(1.2) grayscale(0);
            z-index: 1; /* 光った瞬間だけ手前に */
        }

        .pad.active::after {
            opacity: 0.15; /* 白いベールを一瞬被せる */
        }

        /* ラベル（文字）は極力主張させず、風景に溶け込ませる */
        .pad-label {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 0.6rem;
            opacity: 0.5;
            font-weight: 100;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* =========================================
           Menu: The Portal
           ========================================= */
        #menu {
            position: absolute;
            bottom: 5vmin;
            display: flex;
            gap: 30px;
            z-index: 20;
        }

        .menu-item {
            cursor: pointer;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            opacity: 0.4;
            transition: all 0.4s ease;
            position: relative;
        }

        .menu-item::after {
            content: '';
            position: absolute;
            width: 0%;
            height: 1px;
            bottom: -5px;
            left: 50%;
            background-color: var(--text-color);
            transition: all 0.4s ease;
            transform: translateX(-50%);
        }

        .menu-item:hover, .menu-item.active {
            opacity: 1;
        }

        .menu-item.active::after {
            width: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="meta-display">
        <h1 id="place-name">SOLOSOLA</h1>
        <p id="recorder-name">Soundscape Media</p>
    </div>

    <div id="sampler-wrapper">
        <div id="sampler-container">
            </div>
    </div>

    <div id="menu">
        <div class="menu-item active" onclick="changeSamplerSet('soundscape-tokyo')">TOKYO</div>
        <div class="menu-item" onclick="changeSamplerSet('soundscape-forest')">FOREST</div>
    </div>

    <script>
    /*
     * Soundscape Media "Solosola"
     * Code written with respect for the artist's vision.
     * * Core Concept: 
     * The separation of an image into 16 fragments, reconnected by sound.
     */

    // ==========================================
    // 1. Data Structure (Abstracted for Future JSON)
    // ==========================================
    const BASE_URL = "https://hayaleaf-glitch.github.io/web-sampler/";
    
    const SAMPLER_SETS = {
        'soundscape-tokyo': {
            name: "東京・渋谷駅前",
            recorder: "Recorded by Solosola",
            // 都会の喧騒、コンクリートの質感
            image: "https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=1200", 
            samples: [
                { id: 0, url: 'sample1.mp3', label: '足音' }, { id: 1, url: 'sample2.mp3', label: '接近' },
                { id: 2, url: 'sample3.mp3', label: '雑踏' }, { id: 3, url: 'sample4.mp3', label: '排気' },
                { id: 4, url: 'sample5.mp3', label: '鳥鳴' }, { id: 5, url: 'sample6.mp3', label: '信号' },
                { id: 6, url: 'sample7.mp3', label: '放送' }, { id: 7, url: 'sample8.mp3', label: '昇降' },
                { id: 8, url: 'sample9.mp3', label: '救急' }, { id: 9, url: 'sample10.mp3', label: '警笛' },
                { id: 10, url: 'sample11.mp3', label: '販売' }, { id: 11, url: 'sample12.mp3', label: '入店' },
                { id: 12, url: 'sample13.mp3', label: '遠吠' }, { id: 13, url: 'sample14.mp3', label: '自転' },
                { id: 14, url: 'sample15.mp3', label: '雨音' }, { id: 15, url: 'sample16.mp3', label: '空白' }
            ]
        },
        'soundscape-forest': {
            name: "長野・霧ヶ峰の森",
            recorder: "Recorded by Visitor A",
            // 自然の静寂、有機的な緑
            image: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200",
            samples: [
                { id: 0, url: 'samplea.mp3', label: '落葉' }, { id: 1, url: 'sampleb.mp3', label: '小鳥' },
                { id: 2, url: 'samplec.mp3', label: '葉擦' }, { id: 3, url: 'sampled.mp3', label: '遠雷' },
                { id: 4, url: 'samplee.mp3', label: '羽音' }, { id: 5, url: 'samplef.mp3', label: '水流' },
                { id: 6, url: 'sampleg.mp3', label: '折枝' }, { id: 7, url: 'sampleh.mp3', label: '夜鳥' },
                { id: 8, url: 'samplei.mp3', label: '濃霧' }, { id: 9, url: 'samplej.mp3', label: '獣道' },
                { id: 10, url: 'samplek.mp3', label: '焚火' }, { id: 11, url: 'samplel.mp3', label: '呼吸' },
                { id: 12, url: 'samplem.mp3', label: '静寂' }, { id: 13, url: 'samplen.mp3', label: '飛翔' },
                { id: 14, url: 'sampleo.mp3', label: '雫音' }, { id: 15, url: 'samplep.mp3', label: '空白' }
            ]
        }
    };

    // ==========================================
    // 2. System Core (State & Audio)
    // ==========================================
    let audioContext;
    const audioBuffers = new Array(16);
    let currentSetKey = 'soundscape-tokyo';
    const playingNodes = {};
    const pressedKeys = new Set();
    const keyMap = ['7','8','9','0', 'u','i','o','p', 'j','k','l',';', 'm',',','.','/'];

    function initAudioContext() {
        if (audioContext) return;
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            // 初回のプリロードを確実に
            preloadAllSamples(); 
        } catch (e) {
            console.error("Audio API not supported");
        }
    }

    // ==========================================
    // 3. Logic: Weaving the Fragments
    // ==========================================

    // DOMの生成：1枚の写真を16分割するロジック
    function renderPads(setData) {
        const container = document.getElementById('sampler-container');
        container.innerHTML = ''; // Clear existing

        for (let i = 0; i < 16; i++) {
            const pad = document.createElement('div');
            pad.className = 'pad';
            pad.dataset.id = i;
            pad.dataset.key = keyMap[i];

            // 画像の断片化処理 (Phase 2 Logic)
            // 4x4グリッドにおける座標計算
            const col = i % 4; 
            const row = Math.floor(i / 4);
            
            // background-size: 400% なので、各ポジションは 0%, 33.33%, 66.66%, 100% となる
            const xPos = col * (100 / 3); 
            const yPos = row * (100 / 3);
            
            // 画像とポジションの適用
            pad.style.backgroundImage = `url('${setData.image}')`;
            pad.style.backgroundPosition = `${xPos}% ${yPos}%`;

            // ラベルの追加
            const label = document.createElement('span');
            label.className = 'pad-label';
            label.textContent = setData.samples[i].label;
            pad.appendChild(label);

            // イベントリスナーの登録
            attachEvents(pad);
            container.appendChild(pad);
        }
    }

    // イベントリスナーの付与 (Touch & Mouse)
    function attachEvents(pad) {
        const trigger = (e) => {
            if(e.cancelable) e.preventDefault();
            pad.classList.add('active');
            triggerSample(pad.dataset.id);
        };
        const release = (e) => {
            if(e.cancelable) e.preventDefault();
            pad.classList.remove('active');
            stopSample(pad.dataset.id);
        };

        pad.addEventListener('mousedown', trigger);
        pad.addEventListener('mouseup', release);
        pad.addEventListener('mouseleave', release);
        
        pad.addEventListener('touchstart', trigger, {passive: false});
        pad.addEventListener('touchend', release);
        pad.addEventListener('touchcancel', release);
    }

    // 音源データの非同期ロード (Async/Await)
    async function preloadAllSamples() {
        const currentSetData = SAMPLER_SETS[currentSetKey];
        if (!currentSetData) return;

        // バッファのクリア
        audioBuffers.fill(null);

        const loadPromises = currentSetData.samples.map(async (sample) => {
            if (!sample.url) return;
            try {
                const response = await fetch(BASE_URL + sample.url);
                if (!response.ok) throw new Error(response.status);
                const arrayBuffer = await response.arrayBuffer();
                // AudioContextがない場合はデコードできないためスキップ（再生時に初期化）
                if(audioContext) {
                    audioBuffers[sample.id] = await audioContext.decodeAudioData(arrayBuffer);
                }
            } catch (error) {
                // 静かに失敗する（体験を阻害しない）
                console.warn(`Fragment missing: ${sample.id}`);
            }
        });

        await Promise.all(loadPromises);
    }

    // 世界の切り替え (Phase 3 Logic)
    async function changeSamplerSet(setKey) {
        if (currentSetKey === setKey) return;
        
        // AudioContextの初期化（未実行の場合）
        if (!audioContext) initAudioContext();

        // 1. 視覚的なフェードアウト
        const container = document.getElementById('sampler-container');
        const meta = document.getElementById('meta-display');
        container.style.opacity = 0;
        meta.style.opacity = 0;

        // 2. 音の停止
        Object.keys(playingNodes).forEach(id => stopSample(id));

        // 3. データの更新待ち (少しの間を作る)
        await new Promise(r => setTimeout(r, 600)); 

        currentSetKey = setKey;
        const newData = SAMPLER_SETS[setKey];

        // 4. メタデータの更新
        document.getElementById('place-name').textContent = newData.name;
        document.getElementById('recorder-name').textContent = newData.recorder;

        // 5. メニューの更新
        document.querySelectorAll('.menu-item').forEach(item => {
            // 文字列比較でアクティブ状態を判定
            const isMatch = setKey.includes(item.textContent.toLowerCase());
            item.classList.toggle('active', isMatch);
        });

        // 6. DOM（パッド）の再構築
        renderPads(newData);

        // 7. 音源のロード
        await preloadAllSamples();

        // 8. 視覚的なフェードイン
        container.style.opacity = 1;
        meta.style.opacity = 1;
    }

    // ==========================================
    // 4. Sound Control
    // ==========================================

    function triggerSample(id) {
        if (!audioContext) initAudioContext();
        if (playingNodes[id]) stopSample(id);

        const buffer = audioBuffers[parseInt(id)];
        if (!buffer) return;

        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(audioContext.destination);
        source.start(0);
        playingNodes[id] = source;
    }

    function stopSample(id) {
        if (playingNodes[id]) {
            try {
                playingNodes[id].stop(0);
            } catch(e) { /* ignore */ }
            delete playingNodes[id];
        }
    }

    // ==========================================
    // 5. Keyboard Access
    // ==========================================
    window.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey) return;
        const key = e.key.toLowerCase();
        const pad = document.querySelector(`.pad[data-key="${key}"]`);
        
        if (pad && !pressedKeys.has(key)) {
            pressedKeys.add(key);
            pad.classList.add('active');
            triggerSample(pad.dataset.id);
        }
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        const pad = document.querySelector(`.pad[data-key="${key}"]`);
        
        if (pad) {
            pressedKeys.delete(key);
            pad.classList.remove('active');
            stopSample(pad.dataset.id);
        }
    });

    // ==========================================
    // Initialization
    // ==========================================
    window.addEventListener('load', () => {
        const initialData = SAMPLER_SETS[currentSetKey];
        
        // 初回のDOM構築
        renderPads(initialData);
        
        // メタデータのセット
        document.getElementById('place-name').textContent = initialData.name;
        document.getElementById('recorder-name').textContent = initialData.recorder;
        
        // フェードイン演出
        const meta = document.getElementById('meta-display');
        meta.style.opacity = 1;
    });

    </script>
</body>
</html>
