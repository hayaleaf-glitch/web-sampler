<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Solosola | Ambient Media</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111111">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    <link rel="stylesheet" href="./src/style.css">
    
</head>

<body>
    <div id="loading-indicator">SYSTEM BOOT...</div>

    <div id="top-nav">
        <div class="feed-tabs">
            <div class="feed-tab active" onclick="switchFeed('main')">MAIN</div>
            <div class="feed-tab" onclick="switchFeed('follow')">FOLLOW</div>
            <div class="feed-tab" onclick="switchFeed('gather')">GATHER</div>
        </div>
        <div id="menu-btn" onclick="openModal('main-menu-overlay')">≡</div>
    </div>

    <div id="mode-banner" onclick="cancelMode()">
        <span id="mode-banner-text">EDIT MODE</span>
        <div class="mode-cancel-btn">×</div>
    </div>

    <div id="feed-overlay"></div>

    <div id="main-menu-overlay" class="modal-overlay" onclick="closeModal('main-menu-overlay')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal('main-menu-overlay')">×</span>
            <div id="user-profile-info"></div>
            <div class="modal-section" id="dynamic-menu-container"></div>
            <div class="modal-section" style="margin-top: 40px;">
                <h3>HOW TO PLAY</h3>
                <p style="font-size: 0.8rem; color: #aaa;">16個のパッドをタップして音を奏でます。<br><b>HOLD:</b>
                    ループ音源の再生を維持します。<br><b>FX:</b> 画面上部をスワイプすると、音の響き（フィルター＆リバーブ）が変化します。</p>
            </div>
        </div>
    </div>

    <div id="pad-edit-overlay" class="modal-overlay" onclick="closeModal('pad-edit-overlay')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal('pad-edit-overlay')">×</span>
            <div class="modal-section">
                <h3 id="modal-edit-title">EDIT PAD</h3>
                <div class="form-group" style="margin-top: 15px;">
                    <label class="btn-file-upload" id="upload-btn-label">
                        📁 音源ファイルを選択
                        <input type="file" id="modal-file-input"
                            accept=".mp3, audio/mpeg, .wav, audio/wav, .m4a, audio/mp4, .aac, audio/aac">
                    </label>
                    <div id="modal-file-name"
                        style="font-size: 0.7rem; color: #888; margin-top: 5px; word-break: break-all;">No file selected
                    </div>
                </div>
                <div class="form-group">
                    <label>Label</label>
                    <input type="text" id="modal-edit-label" class="modal-input" placeholder="パッドの表示名">
                </div>
                <div class="form-group">
                    <label>Mode</label>
                    <select id="modal-edit-mode" class="modal-input">
                        <option value="gate">Gate (指を離すと止まる)</option>
                        <option value="oneshot">OneShot (最後まで鳴り切る)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="checkbox-label"><input type="checkbox" id="modal-edit-loop"> Loop Playback</label>
                    <label class="checkbox-label"><input type="checkbox" id="modal-edit-fadeIn"> Fade In
                        (クリック音防止)</label>
                    <label class="checkbox-label"><input type="checkbox" id="modal-edit-random"> Random Start
                        (ループ用)</label>
                </div>
                <div style="display:flex; flex-direction:column; gap:10px; margin-top:25px;">
                    <button class="control-btn" style="width:100%; opacity:1; background:#fff; color:#000;"
                        onclick="savePadEdit()">✓ 完了 (Save)</button>
                    <button class="control-btn"
                        style="width:100%; border-color:var(--danger-color); color:var(--danger-color);"
                        onclick="clearPadEdit()">🗑️ このパッドをクリア</button>
                </div>
            </div>
        </div>
    </div>

    <div id="pwa-fab" onclick="togglePwaPrompt()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
    </div>

    <div id="pwa-prompt">
        <span class="close-prompt" onclick="closePwaPrompt(event)">×</span>
        <b style="font-size: 1rem; color:#00ccff;">📱 アプリ化してフル機能に</b><br><br>
        サクサク演奏するために、ブラウザのメニューから<b>「ホーム画面に追加」</b>を選択してください。
    </div>

    <div id="mobile-fx-zone">
        <div id="mobile-fx-cursor" class="fx-cursor"></div>
    </div>

    <div id="left-col">
        <div id="pc-info-area">
            <h1 id="place-name-pc">SOLOSOLA</h1>
            <p id="recorder-name-pc">Cloud Media</p>
        </div>
    </div>

    <div id="center-col">
        <div id="sampler-wrapper">
            <div id="sampler-container"></div>
        </div>
    </div>

    <div id="right-col">
        <div id="fx-pad-pc">
            <div id="pc-fx-cursor" class="fx-cursor"></div>
        </div>
        <div id="pc-controls-container">
            <div id="hold-btn-pc" class="control-btn">HOLD (H)</div>
            <div id="fx-btn-pc" class="control-btn" onclick="toggleFxMode()">FX (Enter)</div>
        </div>
    </div>

    <div id="mobile-footer">
        <div style="display:flex; gap:30px;">
            <div id="hold-btn-mobile" class="control-btn">HOLD</div>
            <div id="fx-btn-mobile" class="control-btn" onclick="toggleFxMode()">FX</div>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
