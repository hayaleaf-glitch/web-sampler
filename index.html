<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solosola | Soundscape Media</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111111">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           Global Design
           ========================================= */
        :root {
            --bg-color: #111111;
            --text-color: #ffffff;
            --transition-speed: 0.6s;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', 'Noto Sans JP', sans-serif;
            font-weight: 100;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            /* iOSでのオーバースクロール（バウンス）防止 */
            overscroll-behavior: none;
        }

        /* =========================================
           Meta Info
           ========================================= */
        #meta-display {
            position: absolute;
            top: 6vmin;
            left: 6vmin;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #place-name {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 0.15em;
            font-weight: 300;
            text-transform: uppercase;
        }

        #recorder-name {
            margin: 5px 0 0 0;
            font-size: 0.75rem;
            opacity: 0.6;
            letter-spacing: 0.05em;
            font-weight: 100;
        }

        /* =========================================
           The Instrument
           ========================================= */
        #sampler-wrapper {
            width: 85vmin;
            height: 85vmin;
            max-width: 600px;
            max-height: 600px;
            position: relative;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #sampler-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0px;
            width: 100%;
            height: 100%;
            transition: opacity var(--transition-speed) ease;
        }

        .pad {
            position: relative;
            background-color: #222;
            background-size: 400% 400%;
            background-repeat: no-repeat;
            cursor: pointer;
            
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;

            filter: brightness(1.0) grayscale(0.2); 
            transition: filter 0.05s ease-out;
        }

        .pad::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--text-color);
            opacity: 0;
            transition: opacity 0.05s ease-out;
            pointer-events: none;
        }

        .pad.active {
            filter: brightness(1.2) grayscale(0);
            z-index: 1;
        }

        .pad.active::after {
            opacity: 0.15;
        }

        .pad-label {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 0.6rem;
            opacity: 0.5;
            font-weight: 100;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* =========================================
           Menu & Loading
           ========================================= */
        #menu {
            position: absolute;
            bottom: 5vmin;
            display: flex;
            gap: 30px;
            z-index: 20;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .menu-item {
            cursor: pointer;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            opacity: 0.4;
            transition: all 0.4s ease;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-item::after {
            content: '';
            position: absolute;
            width: 0%;
            height: 1px;
            bottom: -5px;
            left: 50%;
            background-color: var(--text-color);
            transition: all 0.4s ease;
            transform: translateX(-50%);
        }

        .menu-item:hover, .menu-item.active {
            opacity: 1;
        }

        .menu-item.active::after {
            width: 100%;
        }

        #loading-indicator {
            position: absolute;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            opacity: 0.7;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

    </style>
</head>
<body>

    <div id="loading-indicator">LOADING SYSTEM...</div>

    <div id="meta-display">
        <h1 id="place-name">SOLOSOLA</h1>
        <p id="recorder-name">Soundscape Media</p>
    </div>

    <div id="sampler-wrapper">
        <div id="sampler-container"></div>
    </div>

    <div id="menu">
        <div class="menu-item active" onclick="changeSamplerSet('soundscape-tokyo')">TOKYO</div>
        <div class="menu-item" onclick="changeSamplerSet('soundscape-forest')">FOREST</div>
    </div>

    <script>
    // ==========================================
    // 1. System Config
    // ==========================================
    const BASE_URL = "https://hayaleaf-glitch.github.io/web-sampler/";
    const DATA_URL = "./data.json"; 
    
    let SAMPLER_SETS = {};

    // ==========================================
    // 2. Audio Core
    // ==========================================
    let audioContext;
    const audioBuffers = new Array(16);
    let currentSetKey = 'soundscape-tokyo';
    const playingNodes = {};
    const pressedKeys = new Set();
    const keyMap = ['7','8','9','0', 'u','i','o','p', 'j','k','l',';', 'm',',','.','/'];

    function initAudioContext() {
        if (audioContext) return;
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            console.error("Audio API not supported");
        }
    }

    // ==========================================
    // 3. Logic: Data Loading & Rendering
    // ==========================================

    async function loadSystemData() {
        try {
            const response = await fetch(DATA_URL);
            if (!response.ok) throw new Error(`Data load failed: ${response.status}`);
            
            const jsonData = await response.json();
            SAMPLER_SETS = jsonData.sets; 
            
            initializeInterface();
        } catch (error) {
            console.error("Critical Error:", error);
            document.getElementById('loading-indicator').textContent = "SYSTEM ERROR";
        }
    }

    async function initializeInterface() {
        document.getElementById('loading-indicator').style.display = 'none';

        const initialData = SAMPLER_SETS[currentSetKey];
        if (!initialData) return;

        renderPads(initialData);
        updateMeta(initialData);

        document.getElementById('sampler-wrapper').style.opacity = 1;
        document.getElementById('meta-display').style.opacity = 1;
        document.getElementById('menu').style.opacity = 1;

        initAudioContext();
        await preloadAllSamples();
    }

    function renderPads(setData) {
        const container = document.getElementById('sampler-container');
        container.innerHTML = '';

        for (let i = 0; i < 16; i++) {
            const pad = document.createElement('div');
            pad.className = 'pad';
            pad.dataset.id = i;
            pad.dataset.key = keyMap[i];

            const col = i % 4; 
            const row = Math.floor(i / 4);
            const xPos = col * (100 / 3); 
            const yPos = row * (100 / 3);
            
            pad.style.backgroundImage = `url('${setData.image}')`;
            pad.style.backgroundPosition = `${xPos}% ${yPos}%`;

            const label = document.createElement('span');
            label.className = 'pad-label';
            label.textContent = setData.samples[i].label;
            pad.appendChild(label);

            attachEvents(pad);
            container.appendChild(pad);
        }
    }

    function updateMeta(data) {
        document.getElementById('place-name').textContent = data.name;
        document.getElementById('recorder-name').textContent = data.recorder;
    }

    function attachEvents(pad) {
        const trigger = (e) => {
            if(e.cancelable && e.type === 'touchstart') e.preventDefault();
            pad.classList.add('active');
            triggerSample(pad.dataset.id);
        };
        
        const release = (e) => {
            if(e.cancelable && e.type === 'touchend') e.preventDefault();
            pad.classList.remove('active');
            stopSample(pad.dataset.id);
        };

        pad.addEventListener('mousedown', trigger);
        pad.addEventListener('mouseup', release);
        pad.addEventListener('mouseleave', release);
        pad.addEventListener('touchstart', trigger, {passive: false});
        pad.addEventListener('touchend', release);
        pad.addEventListener('touchcancel', release);
    }

    async function preloadAllSamples() {
        const currentSetData = SAMPLER_SETS[currentSetKey];
        if (!currentSetData) return;

        audioBuffers.fill(null);

        const loadPromises = currentSetData.samples.map(async (sample) => {
            if (!sample.url) return;
            try {
                const response = await fetch(BASE_URL + sample.url);
                const arrayBuffer = await response.arrayBuffer();
                if(audioContext) {
                    audioBuffers[sample.id] = await audioContext.decodeAudioData(arrayBuffer);
                }
            } catch (error) {
                // Ignore missing samples
            }
        });

        await Promise.all(loadPromises);
    }

    async function changeSamplerSet(setKey) {
        if (currentSetKey === setKey || !SAMPLER_SETS[setKey]) return;
        
        if (!audioContext) initAudioContext();

        const container = document.getElementById('sampler-container');
        const meta = document.getElementById('meta-display');
        
        container.style.opacity = 0;
        meta.style.opacity = 0;

        Object.keys(playingNodes).forEach(id => stopSample(id));

        await new Promise(r => setTimeout(r, 600)); 

        currentSetKey = setKey;
        const newData = SAMPLER_SETS[setKey];

        updateMeta(newData);

        document.querySelectorAll('.menu-item').forEach(item => {
            const isMatch = setKey.includes(item.textContent.toLowerCase());
            item.classList.toggle('active', isMatch);
        });

        renderPads(newData);
        await preloadAllSamples();

        container.style.opacity = 1;
        meta.style.opacity = 1;
    }

    // ==========================================
    // 4. Sound Control
    // ==========================================

    function triggerSample(id) {
        if (!audioContext) initAudioContext();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
        }

        if (playingNodes[id]) stopSample(id);

        const buffer = audioBuffers[parseInt(id)];
        if (!buffer) return;

        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(audioContext.destination);
        source.start(0);
        playingNodes[id] = source;
    }

    function stopSample(id) {
        if (playingNodes[id]) {
            try { playingNodes[id].stop(0); } catch(e) {}
            delete playingNodes[id];
        }
    }

    // ==========================================
    // 5. Input & Init
    // ==========================================
    window.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey) return;
        const key = e.key.toLowerCase();
        const pad = document.querySelector(`.pad[data-key="${key}"]`);
        
        if (pad && !pressedKeys.has(key)) {
            pressedKeys.add(key);
            pad.classList.add('active');
            triggerSample(pad.dataset.id);
        }
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        const pad = document.querySelector(`.pad[data-key="${key}"]`);
        if (pad) {
            pressedKeys.delete(key);
            pad.classList.remove('active');
            stopSample(pad.dataset.id);
        }
    });

    window.addEventListener('load', loadSystemData);

    </script>
</body>
</html>
