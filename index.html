<!DOCTYPE html>
<html>
<head>
    <title>Web Sampler</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #222;
            /* T5-4: 背景画像の設定を追加 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.8s ease-in-out; /* ふわっと切り替える */
        }

        #sampler-container {
            display: grid;
            /* 4列x4行のグリッドを作成 */
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
            
            /* スマホ対応（レスポンシブ）設定 */
            width: 100%;       /* 基本は親要素いっぱいに */
            max-width: 500px;  /* PCでは最大500pxまで */
            padding: 20px;
            
            background-color: #333;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            box-sizing: border-box; /* パディングを含めた幅計算にする */
        }

        .pad {
            background-color: #e74c3c; /* 初期の色: 赤 */
            color: white;
            padding: 25px 0;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            user-select: none; /* テキストが選択されないようにする */
            transition: transform 0.05s ease-out, background-color 0.05s ease-out;
        }

        /* パッドが押されたときの視覚的なフィードバック */
        .pad.active {
            background-color: #c0392b; /* 押されたときの色: 濃い赤 */
            transform: scale(0.95);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5) inset;
        }
    </style>
</head>
<body>
    <div id="sampler-container">
        <div class="pad" data-key="7" data-id="0">7</div>
        <div class="pad" data-key="8" data-id="1">8</div>
        <div class="pad" data-key="9" data-id="2">9</div>
        <div class="pad" data-key="0" data-id="3">0</div>
        
        <div class="pad" data-key="u" data-id="4">U</div>
        <div class="pad" data-key="i" data-id="5">I</div>
        <div class="pad" data-key="o" data-id="6">O</div>
        <div class="pad" data-key="p" data-id="7">P</div>
        
        <div class="pad" data-key="j" data-id="8">J</div>
        <div class="pad" data-key="k" data-id="9">K</div>
        <div class="pad" data-key="l" data-id="10">L</div>
        <div class="pad" data-key=";" data-id="11">;</div>
        
        <div class="pad" data-key="m" data-id="12">M</div>
        <div class="pad" data-key="," data-id="13">,</div>
        <div class="pad" data-key="." data-id="14">.</div>
        <div class="pad" data-key="/" data-id="15">/</div>
    </div>

    <script>
    // ==========================================
    // 1. 初期設定とデータ定義
    // ==========================================
    
    let audioContext;
    const audioBuffers = new Array(16);
    // [あなたのユーザー名]と[リポジトリ名]に合わせて変更してください
    const BASE_URL = "https://hayaleaf-glitch.github.io/web-sampler/";

    // T5-1: 動的コンテンツ構造の定義
    const SAMPLER_SETS = {
        'soundscape-tokyo': {
            name: "東京・渋谷駅前",
            recorder: "Hayaleaf-Glitch",
            // テスト用画像URL
            image: "https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=1000",
            samples: [
                { id: 0, url: 'sample1.mp3', label: '足音' },
                { id: 1, url: 'sample2.mp3', label: '電車接近音' },
                { id: 2, url: 'sample3.mp3', label: '駅の雑踏' },
                { id: 3, url: 'sample4.mp3', label: 'バイクの排気音' },
                
                { id: 4, url: 'sample5.mp3', label: 'カラスの鳴き声' },
                { id: 5, url: 'sample6.mp3', label: '信号の音' },
                { id: 6, url: 'sample7.mp3', label: 'アナウンス' },
                { id: 7, url: 'sample8.mp3', label: 'エスカレーター' },
                
                { id: 8, url: 'sample9.mp3', label: '救急車のサイレン' },
                { id: 9, url: 'sample10.mp3', label: '車のクラクション' },
                { id: 10, url: 'sample11.mp3', label: '販売員の声' },
                { id: 11, url: 'sample12.mp3', label: 'カフェのドアベル' },
                
                { id: 12, url: 'sample13.mp3', label: '犬の吠え声' },
                { id: 13, url: 'sample14.mp3', label: '自転車のベル' },
                { id: 14, url: 'sample15.mp3', label: '雨の音' },
                { id: 15, url: 'sample16.mp3', label: '（空き）' }
            ]
        },
        
        'soundscape-forest': {
            name: "長野・霧ヶ峰の森",
            recorder: "Visitor A",
            // テスト用画像URL
            image: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1000",
            samples: [
                { id: 0, url: 'samplea.mp3', label: '足音' },
                { id: 1, url: 'sampleb.mp3', label: '電車接近音' },
                { id: 2, url: 'samplec.mp3', label: '駅の雑踏' },
                { id: 3, url: 'sampled.mp3', label: 'バイクの排気音' },
                
                { id: 4, url: 'samplee.mp3', label: 'カラスの鳴き声' },
                { id: 5, url: 'samplef.mp3', label: '信号の音' },
                { id: 6, url: 'sampleg.mp3', label: 'アナウンス' },
                { id: 7, url: 'sampleh.mp3', label: 'エスカレーター' },
                
                { id: 8, url: 'samplei.mp3', label: '救急車のサイレン' },
                { id: 9, url: 'samplej.mp3', label: '車のクラクション' },
                { id: 10, url: 'samplek.mp3', label: '販売員の声' },
                { id: 11, url: 'samplel.mp3', label: 'カフェのドアベル' },
                
                { id: 12, url: 'samplem.mp3', label: '犬の吠え声' },
                { id: 13, url: 'samplen.mp3', label: '自転車のベル' },
                { id: 14, url: 'sampleo.mp3', label: '雨の音' },
                { id: 15, url: 'samplep.mp3', label: '（空き）' }
            ]
        }
    };

    let currentSetKey = 'soundscape-tokyo'; 

    // ==========================================
    // 2. コア関数群 (AudioContext, Preload, Play)
    // ==========================================

    function initAudioContext() {
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            console.log("AudioContext initialized.");
            preloadAllSamples(); 
        } catch (e) {
            alert('Web Audio API is not supported in this browser.');
        }
    }

    // T5-1: 動的データ対応版プリロード関数
    async function preloadAllSamples() {
        const currentSetData = SAMPLER_SETS[currentSetKey];
        if (!currentSetData) {
            console.error(`Error: Sampler set '${currentSetKey}' not found.`);
            return;
        }

        audioBuffers.fill(null); 
        console.log(`Starting preload for set: ${currentSetData.name}...`);
    
        const loadPromises = currentSetData.samples.map(async (sample) => {
            const url = BASE_URL + sample.url;
            
            if (!sample.url) {
                audioBuffers[sample.id] = null;
                return;
            }

            try {
                const response = await fetch(url);
                if (!response.ok) {
                     throw new Error(`HTTP Error: ${response.status}`);
                }

                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                audioBuffers[sample.id] = audioBuffer;
            } catch (error) {
                console.error(`Error loading sample ID ${sample.id}:`, error);
                audioBuffers[sample.id] = null;
            }
        });

        try {
            await Promise.all(loadPromises);
            console.log(`Preload complete for set: ${currentSetData.name}`);
            document.getElementById('sampler-container').style.opacity = 1.0;
        } catch (error) {
            console.error("Unexpected error during preload:", error);
        }  
    }

    // T5-2, T5-3, T5-4: セット切り替えのメイン関数
    async function changeSamplerSet(setKey) {
        if (!SAMPLER_SETS[setKey]) {
            console.error(`Sampler set "${setKey}" not found.`);
            return;
        }

        if (!audioContext) initAudioContext();
        
        // 再生停止
        for (let i = 0; i < 16; i++) {
            releaseSample(i.toString());
        }

        // UIをロード中表示に
        const samplerContainer = document.getElementById('sampler-container');
        samplerContainer.style.opacity = 0.3;

        // セット切り替えと再ロード
        currentSetKey = setKey;
        console.log(`Switching to: ${SAMPLER_SETS[setKey].name}`);
        
        await preloadAllSamples(); 

        // UI更新
        const currentSetData = SAMPLER_SETS[setKey];
        const pads = document.querySelectorAll('.pad');

        // 背景画像の更新
        if (currentSetData.image) {
            document.body.style.backgroundImage = `url('${currentSetData.image}')`;
        }

        // ラベルの更新
        pads.forEach((pad) => {
            const id = parseInt(pad.dataset.id, 10);
            const sampleData = currentSetData.samples[id];
            pad.textContent = sampleData.label || pad.dataset.id;
        });

        console.log(`UI Updated for: ${currentSetData.name}`);
        samplerContainer.style.opacity = 1.0; 
        console.log("Ready.");
    }

    function playSample(index) {
        const sampleIndex = parseInt(index, 10);
        if (!audioContext || !audioBuffers[sampleIndex]) return null;
        
        const source = audioContext.createBufferSource();
        source.buffer = audioBuffers[sampleIndex]; 
        source.connect(audioContext.destination);
        source.start(0); 
        
        return source;
    }

    const playingNodes = {};

    function triggerSample(sampleId) {
        if (playingNodes[sampleId]) stopSample(sampleId);
        if (!audioContext) initAudioContext();

        const sourceNode = playSample(sampleId); 
        if (sourceNode) playingNodes[sampleId] = sourceNode;
    }

    function releaseSample(sampleId) {
        stopSample(sampleId);
    }
        
    function stopSample(index) {
        const sourceNode = playingNodes[index];
        if (sourceNode) {
            sourceNode.stop(0); 
            delete playingNodes[index];
        }
    }

    // ==========================================
    // 3. イベントリスナー (操作)
    // ==========================================

    window.addEventListener('load', () => {
        const pads = document.querySelectorAll('.pad');

        pads.forEach(pad => {
            const sampleId = pad.dataset.id;

            // マウス操作
            pad.addEventListener('mousedown', () => {
                pad.classList.add('active');
                triggerSample(sampleId);
            });
            
            pad.addEventListener('mouseup', () => {
                pad.classList.remove('active');
                releaseSample(sampleId);
            });
            
            pad.addEventListener('mouseleave', () => {
                if (pad.classList.contains('active')) {
                    pad.classList.remove('active');
                    releaseSample(sampleId);
                }
            });

            // タッチ操作 (スマホ)
            pad.addEventListener('touchstart', (e) => {
                e.preventDefault(); 
                pad.classList.add('active');
                triggerSample(sampleId);
            }, { passive: false });

            const touchEndHandler = () => {
                pad.classList.remove('active');
                releaseSample(sampleId);
            };

            pad.addEventListener('touchend', touchEndHandler);
            pad.addEventListener('touchcancel', touchEndHandler);
        });

        document.getElementById('sampler-container').style.opacity = 0.5;

        // ★テスト用: 5秒後にセット切り替え
        setTimeout(() => {
            changeSamplerSet('soundscape-forest');
        }, 5000); 
    });

    // キーボード操作
    const pressedKeys = new Set();

    window.addEventListener('keydown', (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey) return; 

        const key = event.key.toLowerCase();
        const pad = document.querySelector(`.pad[data-key="${key}"]`);
        if (!pad) return;

        event.preventDefault(); 
        
        if (pressedKeys.has(key)) return;
        pressedKeys.add(key);
        
        const sampleId = pad.dataset.id;
        pad.classList.add('active');
        triggerSample(sampleId); 
    });

    window.addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        const pad = document.querySelector(`.pad[data-key="${key}"]`);
        if (!pad) return;

        pressedKeys.delete(key);
        const sampleId = pad.dataset.id;
        pad.classList.remove('active');
        releaseSample(sampleId);
    });
    </script>
</body>
</html>
