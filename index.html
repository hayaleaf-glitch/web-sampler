<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Solosola | Soundscape Media</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111111">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #111111;
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --hold-active-color: #ff9900; 
            --transition-speed: 0.6s;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', 'Noto Sans JP', sans-serif;
            font-weight: 100;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
        }

        /* =========================================
           Meta Info
           ========================================= */
        #meta-display {
            position: absolute;
            top: calc(30px + env(safe-area-inset-top));
            left: 30px;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #place-name {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 0.15em;
            font-weight: 300;
            text-transform: uppercase;
        }

        #recorder-name {
            margin: 5px 0 0 0;
            font-size: 0.75rem;
            opacity: 0.6;
            letter-spacing: 0.05em;
            font-weight: 100;
        }

        /* =========================================
           The Instrument
           ========================================= */
        #sampler-wrapper {
            width: 85vmin;
            height: 85vmin;
            max-width: 600px;
            max-height: 600px;
            position: relative;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #sampler-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0px;
            width: 100%;
            height: 100%;
            transition: opacity var(--transition-speed) ease;
        }

        .pad {
            position: relative;
            background-color: #222;
            background-size: 400% 400%;
            background-repeat: no-repeat;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            /* 基本のトランジション */
            transition: filter 0.1s ease-out, transform 0.1s; 
            filter: brightness(1.0) grayscale(0.2); 
        }

        /* アクティブ（タップ直後・発光） */
        .pad.active {
            filter: brightness(1.4) grayscale(0); 
            z-index: 2;
        }
        
        /* 再生中（指を離しても）の表示 */
        .pad.playing {
            filter: brightness(1.1) grayscale(0.1);
        }

        /* ★修正：浄化モード（HOLD中または長押し中） */
        /* .active がなくても単独で機能するように変更 */
        .pad.purifying {
            animation: purify-pulse 4s infinite alternate;
            z-index: 3;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9); 
            border: 1px solid rgba(255,255,255,0.1);
        }

        @keyframes purify-pulse {
            0% { filter: brightness(1.0) grayscale(0.4) blur(0px); }
            100% { filter: brightness(0.4) grayscale(0.9) blur(3px); }
        }

        .pad-label {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 0.6rem;
            opacity: 0.5;
            font-weight: 100;
            pointer-events: none;
        }

        /* =========================================
           Control Bar
           ========================================= */
        #control-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 25;
        }

        .control-btn {
            border: 1px solid var(--text-color);
            padding: 5px 20px;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            color: var(--text-color);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.6;
        }

        .control-btn.active {
            background: var(--text-color);
            color: var(--bg-color);
            opacity: 1;
            font-weight: 400;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* =========================================
           Menu System
           ========================================= */
        #menu-container {
            position: absolute;
            bottom: calc(30px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 20;
            opacity: 0;
            transition: opacity 1s ease;
            width: 100%;
            max-width: 600px;
        }

        #category-menu {
            display: flex;
            gap: 20px;
        }

        .category-item {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            opacity: 0.3;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .category-item.active { opacity: 1; text-decoration: underline; }

        #set-menu {
            display: flex;
            gap: 30px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 0 40px;
            width: 100%;
            box-sizing: border-box;
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            justify-content: flex-start; 
        }
        #set-menu::-webkit-scrollbar { display: none; }
        #set-menu::after { content: ''; min-width: 20px; height: 1px; }

        .menu-item {
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            opacity: 0.4;
            transition: all 0.4s ease;
            position: relative;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .menu-item.active { opacity: 1; }
        .menu-item.active::after {
            content: ''; position: absolute; width: 100%; height: 1px;
            bottom: -5px; left: 0; background-color: var(--text-color);
        }

        #loading-indicator {
            position: absolute;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            opacity: 0.7;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    </style>
</head>
<body>

    <div id="loading-indicator">LOADING SYSTEM...</div>

    <div id="meta-display">
        <h1 id="place-name">SOLOSOLA</h1>
        <p id="recorder-name">Soundscape Media</p>
    </div>

    <div id="sampler-wrapper">
        <div id="sampler-container"></div>
    </div>

    <div id="control-bar">
        <div id="hold-btn" class="control-btn" onclick="toggleHoldMode()">HOLD</div>
    </div>

    <div id="menu-container">
        <div id="category-menu"></div>
        <div id="set-menu"></div>
    </div>

    <script>
    // ==========================================
    // 1. System Config
    // ==========================================
    const BASE_URL = "https://hayaleaf-glitch.github.io/web-sampler/";
    const DATA_URL = "./data.json"; 
    
    let SYSTEM_DATA = {}; 
    let currentCategory = null;
    let currentSetKey = null;

    // ==========================================
    // 2. Audio Core (Phase 3.7 Revised)
    // ==========================================
    let audioContext;
    const audioBuffers = new Array(16);
    const playingNodes = {}; 
    let isHoldMode = false;
    const pressedKeys = new Set();
    const keyMap = ['7','8','9','0', 'u','i','o','p', 'j','k','l',';', 'm',',','.','/'];
    
    const DEFAULT_RELEASE = 0.5;   
    const LONG_PRESS_THRESHOLD = 0.4; 
    const DISSIPATE_DURATION = 30.0;  

    function initAudioContext() {
        if (audioContext) return;
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            console.error("Audio API not supported");
        }
    }

    // ==========================================
    // 3. Logic: Data & UI
    // ==========================================

    async function loadSystemData() {
        try {
            const response = await fetch(DATA_URL);
            if (!response.ok) throw new Error(`Data load failed: ${response.status}`);
            SYSTEM_DATA = await response.json();
            if (SYSTEM_DATA.categories && SYSTEM_DATA.categories.length > 0) {
                selectCategory(SYSTEM_DATA.categories[0].id);
            }
            initializeInterface();
        } catch (error) {
            console.error(error);
            document.getElementById('loading-indicator').textContent = "SYSTEM ERROR";
        }
    }

    function selectCategory(catId) {
        currentCategory = catId;
        const categoryData = SYSTEM_DATA.categories.find(c => c.id === catId);
        renderCategoryMenu();
        renderSetMenu(categoryData.sets);
        if (categoryData.sets.length > 0 && !categoryData.sets.includes(currentSetKey)) {
            changeSamplerSet(categoryData.sets[0]);
        }
    }

    function renderCategoryMenu() {
        const catMenu = document.getElementById('category-menu');
        catMenu.innerHTML = '';
        SYSTEM_DATA.categories.forEach(cat => {
            const el = document.createElement('div');
            el.className = `category-item ${cat.id === currentCategory ? 'active' : ''}`;
            el.textContent = cat.label;
            el.onclick = () => selectCategory(cat.id);
            catMenu.appendChild(el);
        });
    }

    function renderSetMenu(setIds) {
        const setMenu = document.getElementById('set-menu');
        setMenu.innerHTML = '';
        setIds.forEach(setId => {
            const setData = SYSTEM_DATA.sets[setId];
            if (!setData) return;
            const el = document.createElement('div');
            el.textContent = setData.name.split('・')[0] || setData.name; 
            el.className = `menu-item ${setId === currentSetKey ? 'active' : ''}`;
            el.onclick = () => changeSamplerSet(setId);
            setMenu.appendChild(el);
        });
    }

    async function initializeInterface() {
        document.getElementById('loading-indicator').style.display = 'none';
        document.getElementById('sampler-wrapper').style.opacity = 1;
        document.getElementById('meta-display').style.opacity = 1;
        document.getElementById('menu-container').style.opacity = 1;
        document.getElementById('control-bar').style.opacity = 1;
        initAudioContext();
    }

    function renderPads(setData) {
        const container = document.getElementById('sampler-container');
        container.innerHTML = '';

        for (let i = 0; i < 16; i++) {
            const pad = document.createElement('div');
            pad.className = 'pad';
            pad.id = `pad-${i}`;
            pad.dataset.id = i;
            pad.dataset.key = keyMap[i];

            const col = i % 4; 
            const row = Math.floor(i / 4);
            const xPos = col * (100 / 3); 
            const yPos = row * (100 / 3);
            
            pad.style.backgroundImage = `url('${setData.image}')`;
            pad.style.backgroundPosition = `${xPos}% ${yPos}%`;

            const label = document.createElement('span');
            label.className = 'pad-label';
            label.textContent = setData.samples[i].label;
            pad.appendChild(label);

            attachEvents(pad);
            container.appendChild(pad);
        }
    }

    function attachEvents(pad) {
        const trigger = (e) => {
            if(e.cancelable && e.type === 'touchstart') e.preventDefault();
            pad.classList.add('active');
            triggerSample(pad.dataset.id);
            
            // ★修正：浄化演出タイマー
            const purifyTimer = setTimeout(() => {
                // 音が鳴っている状態(playing) または HOLD中 なら浄化開始
                if (pad.classList.contains('active') || isHoldMode) {
                    pad.classList.add('purifying');
                }
            }, LONG_PRESS_THRESHOLD * 1000);
            pad.dataset.purifyTimer = purifyTimer;
        };
        
        const release = (e) => {
            if(e.cancelable && e.type === 'touchend') e.preventDefault();
            pad.classList.remove('active'); // 物理的な指は離れたのでactiveは消す
            
            // ★修正：HOLDモードの場合は、指を離しても浄化（暗さ）を維持する
            if (!isHoldMode) {
                pad.classList.remove('purifying'); 
                clearTimeout(pad.dataset.purifyTimer); 
            }
            // HOLDモードONなら、purifyingクラスは残るし、タイマーもキャンセルしない（これから暗くなる場合のため）

            stopSample(pad.dataset.id);
        };

        pad.addEventListener('mousedown', trigger);
        pad.addEventListener('mouseup', release);
        pad.addEventListener('mouseleave', release);
        pad.addEventListener('touchstart', trigger, {passive: false});
        pad.addEventListener('touchend', release);
        pad.addEventListener('touchcancel', release);
    }

    async function preloadAllSamples() {
        const currentSetData = SYSTEM_DATA.sets[currentSetKey];
        if (!currentSetData) return;
        audioBuffers.fill(null);
        const loadPromises = currentSetData.samples.map(async (sample) => {
            if (!sample.url) return;
            try {
                const response = await fetch(BASE_URL + sample.url);
                const arrayBuffer = await response.arrayBuffer();
                if(audioContext) {
                    audioBuffers[sample.id] = await audioContext.decodeAudioData(arrayBuffer);
                }
            } catch (error) { }
        });
        await Promise.all(loadPromises);
    }

    async function changeSamplerSet(setKey) {
        if (currentSetKey === setKey || !SYSTEM_DATA.sets[setKey]) return;
        if (!audioContext) initAudioContext();
        stopAllSounds(true);
        const container = document.getElementById('sampler-container');
        container.style.opacity = 0;
        await new Promise(r => setTimeout(r, 600)); 
        currentSetKey = setKey;
        const newData = SYSTEM_DATA.sets[setKey];
        document.getElementById('place-name').textContent = newData.name;
        document.getElementById('recorder-name').textContent = newData.recorder;
        const currentCatData = SYSTEM_DATA.categories.find(c => c.id === currentCategory);
        renderSetMenu(currentCatData.sets);
        renderPads(newData);
        await preloadAllSamples();
        container.style.opacity = 1;
    }

    function toggleHoldMode() {
        isHoldMode = !isHoldMode;
        const btn = document.getElementById('hold-btn');
        if (isHoldMode) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
            stopAllSounds(false); // 全停止（ここでpurifyingも消える）
        }
    }

    // ==========================================
    // 4. Advanced Sound Engine
    // ==========================================

    function triggerSample(id) {
        if (!audioContext) initAudioContext();
        if (audioContext && audioContext.state === 'suspended') audioContext.resume();

        const sampleData = SYSTEM_DATA.sets[currentSetKey].samples[id];
        const buffer = audioBuffers[parseInt(id)];
        if (!buffer) return;

        if (playingNodes[id]) {
            if (sampleData.loop || isHoldMode) {
                stopSample(id, true); // 再タップで停止
                return;
            } else {
                stopSample(id, true);
            }
        }

        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.loop = sampleData.loop || false;

        const gainNode = audioContext.createGain();
        source.connect(gainNode);
        gainNode.connect(audioContext.destination);

        const now = audioContext.currentTime;
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(1, now + 0.05);

        // 浄化スケジュール（30秒かけて減衰）
        gainNode.gain.setValueAtTime(1, now + 0.45);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.45 + DISSIPATE_DURATION);

        source.start(0);

        playingNodes[id] = { 
            source: source, 
            gain: gainNode,
            startTime: now 
        };

        document.getElementById(`pad-${id}`).classList.add('playing');
    }

    function stopSample(id, forceStop = false) {
        const node = playingNodes[id];
        if (!node) return;
        const pad = document.getElementById(`pad-${id}`);

        const sampleData = SYSTEM_DATA.sets[currentSetKey].samples[id];

        // HOLD中やOneShotの場合はここでリターンされる（音は止まらない）
        if (!forceStop && isHoldMode) return; 
        if (!forceStop && sampleData.mode === 'oneshot' && !sampleData.loop) {
            // OneShotが自然終了する場合の見た目のリセット
            pad.classList.remove('playing');
            pad.classList.remove('purifying');
            clearTimeout(pad.dataset.purifyTimer);
            delete playingNodes[id];
            return; 
        }

        // ここに来るのは「本当に音を止める」時（リリース処理開始）
        
        // ★修正：音を止める＝浄化状態もリセット
        pad.classList.remove('purifying');
        clearTimeout(pad.dataset.purifyTimer);

        const now = audioContext.currentTime;
        const pressDuration = now - node.startTime;
        let releaseTime = DEFAULT_RELEASE;

        if (pressDuration > LONG_PRESS_THRESHOLD) {
            releaseTime = 0.5 + Math.pow(pressDuration * 0.8, 1.2);
            if (releaseTime > 20) releaseTime = 20;
        }

        node.gain.gain.cancelScheduledValues(now);
        node.gain.gain.setValueAtTime(node.gain.gain.value, now);
        node.gain.gain.exponentialRampToValueAtTime(0.001, now + releaseTime);

        node.source.stop(now + releaseTime);

        delete playingNodes[id];
        pad.classList.remove('playing');
    }

    function stopAllSounds(immediate = false) {
        Object.keys(playingNodes).forEach(id => {
            const pad = document.getElementById(`pad-${id}`);
            if (immediate) {
                try { playingNodes[id].source.stop(0); } catch(e){}
                delete playingNodes[id];
                pad.classList.remove('playing');
                pad.classList.remove('purifying'); // 即時停止時も消す
                clearTimeout(pad.dataset.purifyTimer);
            } else {
                stopSample(id, true);
            }
        });
    }

    window.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey) return;
        const key = e.key.toLowerCase();
        const pad = document.querySelector(`.pad[data-key="${key}"]`);
        
        if (pad && !pressedKeys.has(key)) {
            pressedKeys.add(key);
            pad.classList.add('active');
            triggerSample(pad.dataset.id);
            
            const purifyTimer = setTimeout(() => {
                if (pressedKeys.has(key) || isHoldMode) pad.classList.add('purifying');
            }, LONG_PRESS_THRESHOLD * 1000);
            pad.dataset.purifyTimer = purifyTimer;
        }
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        const pad = document.querySelector(`.pad[data-key="${key}"]`);
        if (pad) {
            pressedKeys.delete(key);
            pad.classList.remove('active');
            
            if (!isHoldMode) {
                pad.classList.remove('purifying');
                clearTimeout(pad.dataset.purifyTimer);
            }
            stopSample(pad.dataset.id);
        }
    });

    window.addEventListener('load', loadSystemData);

    </script>
</body>
</html>
