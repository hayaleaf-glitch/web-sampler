<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Solosola | Soundscape Media</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111111">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #111111;
            --text-color: #ffffff;
            --transition-speed: 0.6s;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', 'Noto Sans JP', sans-serif;
            font-weight: 100;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
        }

        /* =========================================
           Meta Info
           ========================================= */
        #meta-display {
            position: absolute;
            top: calc(40px + env(safe-area-inset-top));
            left: 40px;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #place-name {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 0.15em;
            font-weight: 300;
            text-transform: uppercase;
        }

        #recorder-name {
            margin: 5px 0 0 0;
            font-size: 0.75rem;
            opacity: 0.6;
            letter-spacing: 0.05em;
            font-weight: 100;
        }

        /* =========================================
           The Instrument
           ========================================= */
        #sampler-wrapper {
            width: 85vmin;
            height: 85vmin;
            max-width: 600px;
            max-height: 600px;
            position: relative;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #sampler-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0px;
            width: 100%;
            height: 100%;
            transition: opacity var(--transition-speed) ease;
        }

        .pad {
            position: relative;
            background-color: #222;
            background-size: 400% 400%;
            background-repeat: no-repeat;
            cursor: pointer;
            
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;

            filter: brightness(1.0) grayscale(0.2); 
            transition: filter 0.05s ease-out;
        }

        .pad::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--text-color);
            opacity: 0;
            transition: opacity 0.05s ease-out;
            pointer-events: none;
        }

        .pad.active {
            filter: brightness(1.2) grayscale(0);
            z-index: 1;
        }

        .pad.active::after {
            opacity: 0.15;
        }

        .pad-label {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 0.6rem;
            opacity: 0.5;
            font-weight: 100;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* =========================================
           Menu System (New: Scrollable & Categories)
           ========================================= */
        #menu-container {
            position: absolute;
            bottom: calc(50px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 20;
            opacity: 0;
            transition: opacity 1s ease;
            width: 100%; /* 全幅を使う */
            max-width: 600px;
        }

        /* カテゴリメニュー（上段） */
        #category-menu {
            display: flex;
            gap: 20px;
        }

        .category-item {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            opacity: 0.3;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .category-item.active { opacity: 1; text-decoration: underline; }

        /* セットメニュー（下段・横スクロール） */
        #set-menu {
            display: flex;
            gap: 30px;
            overflow-x: auto; /* 横スクロール有効 */
            white-space: nowrap; /* 折り返し禁止 */
            padding: 0 40px; /* 左右に余白 */
            width: 100%;
            box-sizing: border-box;
            
            /* スクロールバーを隠す */
            -ms-overflow-style: none;
            scrollbar-width: none;
            /* iOS慣性スクロール */
            -webkit-overflow-scrolling: touch;
            
            /* 中央寄せっぽく見せるためのフレックス調整 */
            justify-content: flex-start; 
        }
        #set-menu::-webkit-scrollbar { display: none; }

        /* セット名の後に余白を作る（最後の要素が見切れないように） */
        #set-menu::after {
            content: '';
            min-width: 20px;
            height: 1px;
        }

        .menu-item {
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            opacity: 0.4;
            transition: all 0.4s ease;
            position: relative;
            flex-shrink: 0; /* 縮まないようにする */
            -webkit-tap-highlight-color: transparent;
        }

        .menu-item::after {
            content: '';
            position: absolute;
            width: 0%;
            height: 1px;
            bottom: -5px;
            left: 50%;
            background-color: var(--text-color);
            transition: all 0.4s ease;
            transform: translateX(-50%);
        }

        .menu-item:hover, .menu-item.active {
            opacity: 1;
        }
        .menu-item.active::after {
            width: 100%;
        }

        #loading-indicator {
            position: absolute;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            opacity: 0.7;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="loading-indicator">LOADING SYSTEM...</div>

    <div id="meta-display">
        <h1 id="place-name">SOLOSOLA</h1>
        <p id="recorder-name">Soundscape Media</p>
    </div>

    <div id="sampler-wrapper">
        <div id="sampler-container"></div>
    </div>

    <div id="menu-container">
        <div id="category-menu">
            </div>
        <div id="set-menu">
            </div>
    </div>

    <script>
    // ==========================================
    // 1. System Config
    // ==========================================
    const BASE_URL = "https://hayaleaf-glitch.github.io/web-sampler/";
    const DATA_URL = "./data.json"; 
    
    let SYSTEM_DATA = {}; // 全データ
    let currentCategory = null;
    let currentSetKey = null; // 初期値はロード後に決定

    // ==========================================
    // 2. Audio Core
    // ==========================================
    let audioContext;
    const audioBuffers = new Array(16);
    const playingNodes = {};
    const pressedKeys = new Set();
    const keyMap = ['7','8','9','0', 'u','i','o','p', 'j','k','l',';', 'm',',','.','/'];

    function initAudioContext() {
        if (audioContext) return;
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            console.error("Audio API not supported");
        }
    }

    // ==========================================
    // 3. Logic: Data Loading & Rendering
    // ==========================================

    async function loadSystemData() {
        try {
            const response = await fetch(DATA_URL);
            if (!response.ok) throw new Error(`Data load failed: ${response.status}`);
            
            SYSTEM_DATA = await response.json();
            
            // 初期カテゴリとセットを決定
            if (SYSTEM_DATA.categories && SYSTEM_DATA.categories.length > 0) {
                // 最初のカテゴリを選択
                selectCategory(SYSTEM_DATA.categories[0].id);
            } else {
                // カテゴリがない場合のフォールバック（旧仕様対策）
                console.error("Invalid Data Structure");
            }
            
            initializeInterface();
        } catch (error) {
            console.error("Critical Error:", error);
            document.getElementById('loading-indicator').textContent = "SYSTEM ERROR";
        }
    }

    // カテゴリ選択時の処理
    function selectCategory(catId) {
        currentCategory = catId;
        const categoryData = SYSTEM_DATA.categories.find(c => c.id === catId);
        
        // カテゴリUIの更新
        renderCategoryMenu();
        
        // セットメニューの更新（そのカテゴリに属するセットのみ表示）
        renderSetMenu(categoryData.sets);
        
        // そのカテゴリの最初のセットを自動選択（初回ロード時やカテゴリ切り替え時）
        if (categoryData.sets.length > 0) {
            // 既に選択中のセットがこのカテゴリに含まれていれば維持、そうでなければ先頭へ
            if (!categoryData.sets.includes(currentSetKey)) {
                changeSamplerSet(categoryData.sets[0]);
            }
        }
    }

    // カテゴリメニュー描画
    function renderCategoryMenu() {
        const catMenu = document.getElementById('category-menu');
        catMenu.innerHTML = '';
        
        SYSTEM_DATA.categories.forEach(cat => {
            const el = document.createElement('div');
            el.className = `category-item ${cat.id === currentCategory ? 'active' : ''}`;
            el.textContent = cat.label;
            el.onclick = () => selectCategory(cat.id);
            catMenu.appendChild(el);
        });
    }

    // セットメニュー描画（横スクロール対応）
    function renderSetMenu(setIds) {
        const setMenu = document.getElementById('set-menu');
        setMenu.innerHTML = '';
        
        setIds.forEach(setId => {
            const setData = SYSTEM_DATA.sets[setId];
            if (!setData) return;

            const el = document.createElement('div');
            // 表示名は短縮（TOKYOなど）にするか、そのままか。今回はnameを使うが、
            // 将来的にはshort_nameをJSONに追加しても良い。
            // ここでは簡易的にスペース区切りの最初の単語などを表示するなどの処理も可能だが、
            // 一旦そのまま表示する。
            // CSSで折り返さない設定にしているため、長くても横スクロールできる。
            
            // 表示用の名前を生成（英語部分だけ抜き出すなど工夫可能だが、今はそのまま）
            // メニューには少し短めの名前がいいので、ラベル用のデータがない場合はnameを使う
            el.textContent = setData.name.split('・')[0] || setData.name; // 「東京・渋谷」なら「東京」だけ表示してみる工夫
            
            el.className = `menu-item ${setId === currentSetKey ? 'active' : ''}`;
            el.onclick = () => changeSamplerSet(setId);
            setMenu.appendChild(el);
        });
    }

    async function initializeInterface() {
        document.getElementById('loading-indicator').style.display = 'none';

        document.getElementById('sampler-wrapper').style.opacity = 1;
        document.getElementById('meta-display').style.opacity = 1;
        document.getElementById('menu-container').style.opacity = 1;

        initAudioContext();
    }

    function renderPads(setData) {
        const container = document.getElementById('sampler-container');
        container.innerHTML = '';

        for (let i = 0; i < 16; i++) {
            const pad = document.createElement('div');
            pad.className = 'pad';
            pad.dataset.id = i;
            pad.dataset.key = keyMap[i];

            const col = i % 4; 
            const row = Math.floor(i / 4);
            const xPos = col * (100 / 3); 
            const yPos = row * (100 / 3);
            
            pad.style.backgroundImage = `url('${setData.image}')`;
            pad.style.backgroundPosition = `${xPos}% ${yPos}%`;

            const label = document.createElement('span');
            label.className = 'pad-label';
            label.textContent = setData.samples[i].label;
            pad.appendChild(label);

            attachEvents(pad);
            container.appendChild(pad);
        }
    }

    function updateMeta(data) {
        document.getElementById('place-name').textContent = data.name;
        document.getElementById('recorder-name').textContent = data.recorder;
    }

    function attachEvents(pad) {
        const trigger = (e) => {
            if(e.cancelable && e.type === 'touchstart') e.preventDefault();
            pad.classList.add('active');
            triggerSample(pad.dataset.id);
        };
        
        const release = (e) => {
            if(e.cancelable && e.type === 'touchend') e.preventDefault();
            pad.classList.remove('active');
            stopSample(pad.dataset.id);
        };

        pad.addEventListener('mousedown', trigger);
        pad.addEventListener('mouseup', release);
        pad.addEventListener('mouseleave', release);
        pad.addEventListener('touchstart', trigger, {passive: false});
        pad.addEventListener('touchend', release);
        pad.addEventListener('touchcancel', release);
    }

    async function preloadAllSamples() {
        const currentSetData = SYSTEM_DATA.sets[currentSetKey];
        if (!currentSetData) return;

        audioBuffers.fill(null);

        const loadPromises = currentSetData.samples.map(async (sample) => {
            if (!sample.url) return;
            try {
                const response = await fetch(BASE_URL + sample.url);
                const arrayBuffer = await response.arrayBuffer();
                if(audioContext) {
                    audioBuffers[sample.id] = await audioContext.decodeAudioData(arrayBuffer);
                }
            } catch (error) {
                // Ignore missing samples
            }
        });

        await Promise.all(loadPromises);
    }

    async function changeSamplerSet(setKey) {
        if (currentSetKey === setKey || !SYSTEM_DATA.sets[setKey]) return;
        
        if (!audioContext) initAudioContext();

        const container = document.getElementById('sampler-container');
        const meta = document.getElementById('meta-display');
        
        container.style.opacity = 0;
        meta.style.opacity = 0;

        Object.keys(playingNodes).forEach(id => stopSample(id));

        await new Promise(r => setTimeout(r, 600)); 

        currentSetKey = setKey;
        const newData = SYSTEM_DATA.sets[setKey];

        updateMeta(newData);
        
        // メニューのハイライト更新
        const menuItems = document.querySelectorAll('#set-menu .menu-item');
        // 再描画したほうが早いが、今回はclass制御で対応
        // Note: カテゴリ切り替え時にrenderSetMenuが走るので、ここでは簡易的なclass付替は難しい。
        // なので、renderSetMenuを呼んでしまうのが確実。
        const currentCatData = SYSTEM_DATA.categories.find(c => c.id === currentCategory);
        renderSetMenu(currentCatData.sets);

        renderPads(newData);
        await preloadAllSamples();

        container.style.opacity = 1;
        meta.style.opacity = 1;
    }

    // ==========================================
    // 4. Sound Control (Phase 3.5: Still Basic)
    // ==========================================

    function triggerSample(id) {
        if (!audioContext) initAudioContext();
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
        }

        if (playingNodes[id]) stopSample(id);

        const buffer = audioBuffers[parseInt(id)];
        if (!buffer) return;

        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(audioContext.destination);
        source.start(0);
        playingNodes[id] = source;
    }

    function stopSample(id) {
        if (playingNodes[id]) {
            try { playingNodes[id].stop(0); } catch(e) {}
            delete playingNodes[id];
        }
    }

    // ==========================================
    // 5. Input & Init
    // ==========================================
    window.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey) return;
        const key = e.key.toLowerCase();
        const pad = document.querySelector(`.pad[data-key="${key}"]`);
        
        if (pad && !pressedKeys.has(key)) {
            pressedKeys.add(key);
            pad.classList.add('active');
            triggerSample(pad.dataset.id);
        }
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        const pad = document.querySelector(`.pad[data-key="${key}"]`);
        if (pad) {
            pressedKeys.delete(key);
            pad.classList.remove('active');
            stopSample(pad.dataset.id);
        }
    });

    window.addEventListener('load', loadSystemData);

    </script>
</body>
</html>
