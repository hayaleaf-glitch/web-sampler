<!DOCTYPE html>
<html>
<head>
    <title>Web Sampler</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #222;
        }

        #sampler-container {
            display: grid;
            /* 4列x4行のグリッドを作成 */
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
            width: 500px;
            padding: 20px;
            background-color: #333;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .pad {
            background-color: #e74c3c; /* 初期の色: 赤 */
            color: white;
            padding: 25px 0;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            user-select: none; /* テキストが選択されないようにする */
            transition: transform 0.05s ease-out, background-color 0.05s ease-out;
            /* T3-2で低遅延の視覚フィードバックに使用 */
        }

        /* パッドが押されたときの視覚的なフィードバック */
        .pad.active {
            background-color: #c0392b; /* 押されたときの色: 濃い赤 */
            transform: scale(0.95);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5) inset;
        }
    </style>
</head>
<body>
    <div id="sampler-container">
    <div class="pad" data-key="7" data-id="0">7</div>
    <div class="pad" data-key="8" data-id="1">8</div>
    <div class="pad" data-key="9" data-id="2">9</div>
    <div class="pad" data-key="0" data-id="3">0</div>
    
    <div class="pad" data-key="u" data-id="4">U</div>
    <div class="pad" data-key="i" data-id="5">I</div>
    <div class="pad" data-key="o" data-id="6">O</div>
    <div class="pad" data-key="p" data-id="7">P</div>
    
    <div class="pad" data-key="j" data-id="8">J</div>
    <div class="pad" data-key="k" data-id="9">K</div>
    <div class="pad" data-key="l" data-id="10">L</div>
    <div class="pad" data-key=";" data-id="11">;</div>
    
    <div class="pad" data-key="m" data-id="12">M</div>
    <div class="pad" data-key="," data-id="13">,</div>
    <div class="pad" data-key="." data-id="14">.</div>
    <div class="pad" data-key="/" data-id="15">/</div>
</div>

    <script>
        // T2-1: AudioContext の初期化
        let audioContext;
        // T2-2: プリロードした音声データを格納する配列（16個）
    const audioBuffers = new Array(16);
    // T2-2: T1-2で取得した、MP3ファイルへのベースURL
    // [あなたのユーザー名]と[リポジトリ名]を置き換えてください！
    const BASE_URL = "https://hayaleaf-glitch.github.io/web-sampler/";

        function initAudioContext() {
        // ブラウザの互換性を考慮した AudioContext の作成
        try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        console.log("AudioContext が正常に初期化されました。");
        
        // ★ T2-2 の実行：コンテキスト初期化後、すぐにプリロードを開始 ★
        preloadAllSamples(); 

        } catch (e) {
        alert('Web Audio API はこのブラウザでは利用できません。');
        return;
        }
        }
        // ユーザーの操作をきっかけにコンテキストを初期化することが重要
        // サンプラー起動時に一度だけ呼び出します。
        // initAudioContext(); // ユーザー操作なしでは実行しない

        // 個別の音声ファイルを読み込み、AudioBufferにデコードする関数
    async function loadSample(index) {
        const fileName = `sample${index + 1}.mp3`; // sample1.mp3, sample2.mp3...
        const url = BASE_URL + fileName;

        try {
            // 1. ネットワークからファイルをバイナリデータとして取得
            const response = await fetch(url);
            
            // ★重要チェック★: 404エラーもfetch自体は成功するため、ここでチェックが必要
            if (!response.ok) {
                 throw new Error(`HTTPエラー: ${response.status} ${response.statusText}`);
            }
            
            const arrayBuffer = await response.arrayBuffer();

            // 2. AudioContextを使ってAudioBufferにデコード（低遅延の鍵）
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            
            // 3. 配列に格納
            audioBuffers[index] = audioBuffer;
            console.log(`Sample ${index + 1} (${fileName}) のプリロードが完了しました。`);

            } catch (error) {
            console.error(`Sample ${index + 1} の読み込みエラー:`, error);
            // ★ T2-2 の最重要修正点 ★
            // エラーを再スローして、Promise.all を失敗させる
            throw error; 
            }
            }

        // 全てのサンプルを並行してプリロードする関数
    async function preloadAllSamples() {
        console.log("すべてのサンプルのプリロードを開始します...");
        const promises = [];
        
        for (let i = 0; i < 16; i++) {
            // 16個の読み込み処理を並列で実行
            promises.push(loadSample(i));
        }

        // 全てのプリロードが完了するまで待機
        await Promise.all(promises);
        console.log("すべてのサンプルのプリロードが完了しました！");
        
        // プリロードが完了したら、ボタンを押せるようにUIを更新するなど（オプション）
        document.getElementById('sampler-container').style.opacity = 1;
    }

        function playSample(index) {
        // indexは文字列として渡される可能性があるので、整数に変換
        const sampleIndex = parseInt(index, 10);
        
        // 1. AudioContextが初期化され、AudioBufferが読み込まれているかチェック
        if (!audioContext || !audioBuffers[sampleIndex]) {
            console.warn(`Sample ${sampleIndex} がまだ読み込まれていないか、AudioContextが未初期化です。`);
            return null; // 再生失敗
        }
        
        // 2. ★低遅延の鍵★: 再生するたびに新しいノードを作成する
        const source = audioContext.createBufferSource();
        source.buffer = audioBuffers[sampleIndex]; // プリロードされた音源をセット
        
        // 3. AudioContextの出力先に接続 (音がスピーカーに届くようにする)
        source.connect(audioContext.destination);
        
        // 4. 再生開始！
        source.start(0); // 可能な限り即座に再生を開始
        
        return source; // T3-3の停止ロジックのためにノードを返す
    }

        // T3-3: 停止ロジックの実装 (ここを追加)
    function stopSample(index) {
        // index は文字列として渡される可能性があるので、そのまま playingNodes のキーとして使用
        const sourceNode = playingNodes[index];
        
        // 再生中のノードが存在するか確認
        if (sourceNode) {
            // Web Audio API の stop() メソッドで即座に音を停止
            sourceNode.stop(0); 
            // 停止後、追跡リストからノードを削除
            delete playingNodes[index];
        }
    }

// T3-3のために、現在再生中のノードを追跡するためのマップを定義
    const playingNodes = {}; 

window.addEventListener('load', () => {
        const pads = document.querySelectorAll('.pad');
        let isInitialized = false;

        pads.forEach(pad => {
            const sampleId = pad.dataset.id;
            const key = pad.dataset.key; // キーボード入力用 (T3-3で使う)

            // 1. 再生ロジック (mousedown)
            pad.addEventListener('mousedown', () => {
                // 1. 初回起動チェック
                if (!isInitialized) {
                    initAudioContext(); // AudioContext & プリロード開始
                    isInitialized = true;
                }
                
                // 2. パッドをアクティブにし、再生ロジックを実行
                pad.classList.add('active');
                
                // T3-2: 再生ロジックの呼び出し
                const sourceNode = playSample(sampleId); 

                // T3-3の準備: 再生中のノードを記録
                if (sourceNode) {
                    playingNodes[sampleId] = sourceNode;
                }
            });
            
            // 2. 停止ロジック (mouseup)
            pad.addEventListener('mouseup', () => {
                pad.classList.remove('active');
                stopSample(sampleId);
            });
            
            // 3. 停止ロジック (mouseleave)
            pad.addEventListener('mouseleave', () => {
                if (pad.classList.contains('active')) {
                    pad.classList.remove('active');
                    stopSample(sampleId);
                }
            });
        });
            

        // プリロード中であることを示すため、初期状態ではUIを暗く/半透明にしておく
        document.getElementById('sampler-container').style.opacity = 0.5;
    });



        

        
    </script>
</body>
</html>
